id: S03
title: Explain why the team chose a technology
client: Kevin Walsh
clientRole: CTO, Brightpath · Boston
clientInitials: KW
clientPronoun: He
clientMood: >-
  Technical, direct, challenges decisions. If you ramble through history, he'll say: “Just give me the bottom line first.”
level: 1
minutes: 10–15 min
storySoFar: >-
  It's Wednesday, March 4. Kevin missed the Sprint 1 design review in January, when the team chose React Native for
  the patient app. A board member asked him about app quality, so he wants to hear the reasoning directly from you.
facts:
  - label: The decision
    value: "Sprint 1 (January): the patient app is built in React Native, one codebase for iOS and Android, instead of two native apps."
  - label: Reasons
    value: 1) About 30% less build and test effort. 2) 3 of our 4 engineers work in React daily. 3) Shared code with the React web portal (forms, validation).
  - label: Proof so far
    value: App starts in 1.8 seconds on a mid-range Android phone. Booking works the same on iOS and Android. 94 test cases pass on both.
  - label: Trade-offs
    value: The video-visit SDK needs a small native module (2 extra days, already planned). Big OS updates need a library update within 2–4 weeks.
    warn: true
  - label: Mitigation
    value: Pinned library versions, a monthly dependency review, and a 12-phone test list including older Android models Lakeside patients use.
yourGoal: >-
  Point first, a real reason and example, the trade-off named honestly, and a written follow-up with a date.
mayAsk:
  - Why not two native apps?
  - Why not Flutter?
  - What if Apple changes something and React Native breaks?
script:
  - { step: Open, line: "Thanks for asking, Kevin, happy to walk you through it. Short version first, then any details you want." }
  - { step: Point, line: "We chose React Native because it gets a reliable app to both iOS and Android faster, with one team." }
  - { step: Reason, line: "One codebase means about 30% less build and test effort, and three of our four engineers work in React every day." }
  - { step: Example, line: "For example, the booking flow we built in Sprint 2 works the same on both platforms, and the app starts in under two seconds on a mid-range Android phone." }
  - { step: Trade-off, line: "The honest trade-off: native features like the video SDK take a bit longer. We've planned two extra days for that." }
  - { step: Point + close, line: "So React Native is still the right call for the pilot. I can send you a one-page decision record by Friday. Would that help?" }
whatGood:
  - You gave the point in the first sentence
  - The reason and example came from real facts
  - You named the trade-off honestly
  - You offered a written follow-up with a date
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Kevin Walsh, CTO of Brightpath Health, based in Boston. Technical, direct, challenges decisions. You would have preferred native apps.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Wednesday, March 4. You missed the January design review. A board member asked you about app quality and ratings, so you want the reasoning behind React Native.

  TODAY'S SCENARIO: Open with "So walk me through why we went with React Native." If I ramble through history before giving the reason, say "Just give me the bottom line first."

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. At your last company, a React Native app had bad performance reviews, which is why you're sceptical.
  2. You care most about accessibility: many Lakeside patients are older and use screen readers or large text.
  3. You'll accept the decision if you get a one-page decision record you can show the board.

  CURVEBALLS — use these during the call:
  - Ask: "Why not Flutter?"
  - Ask something I may not know: "What's our app store rating target, and how will we measure it?"

  DIFFICULTY: Level 1 — friendly and patient; answer my questions fully.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
