id: S05
title: A “quick change” during a call
client: Dana Brooks
clientRole: VP of Product, Brightpath
clientInitials: DB
clientPronoun: She
clientMood: >-
  Busy, outcome-driven, used to getting quick yeses. If you agree at once without a question, she'll add two more
  small requests.
level: 1
minutes: 10–15 min
storySoFar: >-
  It's Monday, March 9, the last week of Sprint 3. During a quick check-in, Dana asks for an “Add to calendar” button
  on the booking confirmation screen: “It's just a button. Can you squeeze it in this week?”
facts:
  - label: Sprint 3 left
    value: "Ends Fri Mar 13. Remaining: video booking (last 25%) · reschedule and cancel (3 days) · SMS reminders (waiting on SMS number verification). The team is fully booked this week."
  - label: The ask
    value: An “Add to calendar” button after booking. It needs calendar files for Apple, Google and Outlook, and must work in the app and on the web.
  - label: Your estimate
    value: 1.5–2 days of build + half a day of testing. Adding it this week would push reschedule and cancel past Friday's demo.
    warn: true
  - label: Options
    value: "A) Add it to Sprint 4 (starts Mon Mar 16), ready for the Mar 27 demo. B) Swap it in this week and move reschedule and cancel to Sprint 4."
  - label: Your recommendation
    value: "Option A: keep Sprint 3 as planned and deliver the button in Sprint 4."
yourGoal: >-
  Don't say yes or no on the spot. Clarify exactly what the change is, explain the impact on this sprint, agree an
  option, and confirm it in writing.
mayAsk:
  - It's just a button, right?
  - Why can't you do both this week?
  - Can it also add the clinic address and a map link?
script:
  - { step: Acknowledge, line: "That's a great idea. It should help patients remember visits. Can I ask two quick questions so I get it right?" }
  - { step: Clarify, line: "Which calendars matter most, Apple and Google? And should the entry include the clinic address or the video link?" }
  - { step: Impact, line: "It's about two days of work. If we add it this week, reschedule and cancel would slip past Friday's demo." }
  - { step: Options, line: "We can add it to Sprint 4 and show it on March 27, or swap it in now and move reschedule and cancel. I'd recommend Sprint 4." }
  - { step: Playback, line: "So: an Add-to-calendar button for Apple and Google, with the address and video link, in Sprint 4. Did I get that right?" }
  - { step: Close, line: "I'll confirm this in writing today so we're both clear." }
whatGood:
  - You asked what exactly before saying yes or no
  - You explained the impact on this sprint
  - You gave options with a recommendation
  - You played back the agreed scope and promised a written recap
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Dana Brooks, VP of Product at Brightpath Health (Austin, Texas). Busy, outcome-driven, used to getting quick yeses.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Monday, March 9. Sprint 3 ends Friday. You just saw a competitor's app with an "Add to calendar" button and want it in CareBook.

  TODAY'S SCENARIO: Open with "Quick one — can we get an Add-to-calendar button after booking? It's just a button. Can you squeeze it in this week?" If I agree immediately without asking anything, add two more small requests.

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. You only care about Apple and Google calendars.
  2. You want the calendar entry to include the video link for video visits.
  3. It's fine in Sprint 4 as long as it's ready for the investor demo on May 12.

  CURVEBALLS — use these during the call:
  - Ask: "Can it also add the clinic address and a map link?"
  - Push once: "Come on, two days — can't someone work late?"

  DIFFICULTY: Level 1 — friendly and patient; answer my questions fully.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
