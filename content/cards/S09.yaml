id: S09
title: A long, messy requirement explanation
client: Maria Lopez
clientRole: Director of Revenue Cycle, Suncoast Billing
clientInitials: ML
clientPronoun: She
clientMood: >-
  Numbers-driven, detail-focused, talks fast and in billing jargon. Busy and a little impatient. If you don't play
  it back, she assumes you understood and moves on.
level: 2
minutes: 10–15 min
storySoFar: >-
  It's Wednesday, March 18. Sprint 5 (starting Mar 30) includes the insurance eligibility check through Suncoast's
  API. Our tech lead asked Suncoast for the requirements, and Maria joined a call to explain, in one long, messy
  stream.
facts:
  - label: Planned work
    value: "Sprint 5: CareBook calls Suncoast's eligibility API to check a patient's insurance before visits. Effort planned: 6 days."
  - label: Why it matters
    value: Suncoast's telehealth claim denial rate is 12%, mostly because of eligibility errors, coverage that was inactive or wrong when the visit happened.
  - label: What we know
    value: The API returns “active/inactive” plus plan details. Suncoast's API docs are incomplete, and response formats may differ from the docs.
    warn: true
  - label: Still unclear
    value: When to check · what to do if coverage is inactive · what happens if the API is down · what is out of scope.
  - label: Your job
    value: "Let Maria talk, take notes, then play back in 3 bullets: when we check, what we do with the result, and what's out of scope."
yourGoal: >-
  Turn a long, messy explanation into a 3-bullet playback, get Maria to confirm or correct it, and agree what Maria
  will send in writing.
mayAsk:
  - So you've got all that, right?
  - Can this be ready for the pilot?
  - Is your system checking the 271 response?
script:
  - { step: Listen, line: "That's really helpful, Maria. Let me make sure I have it right before we build anything." }
  - { step: Playback 1, line: "One: we check eligibility when the patient books, and again at check-in." }
  - { step: Playback 2, line: "Two: if coverage is inactive, we don't block the booking. We flag it for the front desk." }
  - { step: Playback 3, line: "Three: showing copay amounts is out of scope for now. Did I get that right, or did I miss something?" }
  - { step: Clarify term, line: "You mentioned a “271 response”. Is that the eligibility result the API sends back?" }
  - { step: Close, line: "I'll send this playback in writing today. Could you send the Medicaid payer list by Friday?" }
whatGood:
  - You listened without interrupting
  - Your 3-bullet playback covered when, what, and out of scope
  - You asked what the jargon meant
  - You agreed a written follow-up and Maria's next action
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Maria Lopez, Director of Revenue Cycle at Suncoast Billing (Tampa, Florida) — Brightpath's billing partner. Numbers-driven, detail-focused, talks fast and in billing jargon.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Wednesday, March 18. CareBook will start calling your eligibility API in Sprint 5 (from March 30). Telehealth claim denials are at 12%, mostly eligibility errors.

  TODAY'S SCENARIO: Open with a 60–90 second, rambling explanation that mixes all the hidden facts together with billing jargon (such as "271 response" and "payer ID"), jumping between topics. Then say "So you've got all that, right?" If I don't play it back, assume I understood and move on. If my playback misses something, correct only one point.

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. Check eligibility twice: when the patient books, and again at check-in.
  2. If coverage is inactive, don't block the booking — flag it to the front desk so they can ask the patient for new insurance.
  3. If the API is down, never block booking: retry every 15 minutes for up to 4 hours.
  4. Out of scope for now: showing copay amounts to patients (phase 2).
  5. Medicaid patients use a different payer ID list, which you'll send by Friday.

  CURVEBALLS — use these during the call:
  - Use "271 response" without explaining it, and see if I ask.
  - Ask: "Can this be ready for the pilot?"

  DIFFICULTY: Level 2 — busy and vague; short answers, change topic, slightly impatient.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
