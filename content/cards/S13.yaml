level: 1
minutes: 10–15 min
storySoFar: >-
  It's Monday, March 30, the first day of Sprint 5. Dana mentioned that Lakeside is “moving into value-based
  contracts” and that it may change what they want from CareBook. Dr. Mercer has offered 15 minutes to explain how
