id: S17
title: Two stakeholders want different things (stability vs speed)
client: Kevin Walsh and Dana Brooks
clientRole: CTO and VP of Product, Brightpath Health
clientInitials: KD
clientPronoun: They
clientMood: >-
  Dana wants speed and features; Kevin wants stability and no shortcuts. If you agree with whoever spoke last, the
  other one says: “So you're just going to say yes to everyone?”
level: 2
minutes: 10–15 min
storySoFar: >-
