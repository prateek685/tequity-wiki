script:
  - { step: Open, line: "Thanks, both. You want two different things for the pilot, and both matter. Can I play back what I've heard, then show you two options?" }
  - { step: Playback, line: "Dana, you want the waitlist in the pilot because ___. Kevin, you want a freeze on April 17 so we launch stable. Is that fair?" }
