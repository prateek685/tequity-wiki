id: S21
title: Scope creep in the middle of a sprint
client: Dana Brooks
clientRole: VP of Product, Brightpath
clientInitials: DB
clientPronoun: She
clientMood: >-
  Fast, persuasive, under pressure from the CEO. She insists it's small. If you say a flat no, she'll say: “That's not
  the partner attitude I expected.”
level: 3
minutes: 15 min
storySoFar: >-
  It's Friday, April 10, the last day of Sprint 5. Sprint 6 (April 13–24) was planned yesterday: finish the Epic sync,
  performance, accessibility, and user acceptance testing with Lakeside. Dana has just called with a “tiny” request
  for the pilot.
facts:
  - label: Sprint 5 result
    value: "Eligibility check done · audit logging done · Epic appointment sync 80% (finishing in Sprint 6)."
  - label: Sprint 6 (Apr 13–24)
