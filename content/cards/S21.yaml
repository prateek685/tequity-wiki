  - label: The new ask
    value: "Patients upload a photo of their insurance card in the intake form — for the pilot."
  - label: Your estimate
    value: "5–7 days: camera and upload in the app, secure storage (the card image is PHI), clinic staff view, and Kevin's security review."
    warn: true
  - label: Options
    value: "A) Sprint 7 (May 11–22), after the pilot. B) Sprint 6, by dropping the accessibility fixes — risky for older patients. C) Keep typed member IDs, which already work."
