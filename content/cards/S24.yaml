id: S24
title: An upset client after a production bug affected patient reminders
client: Dr. Alan Mercer
clientRole: Chief Medical Information Officer, Lakeside Health
clientInitials: AM
clientPronoun: He
clientMood: >-
  Careful, clinical, protective of his patients, and upset. If you interrupt him or start with technical details,
  he'll say: “I don't need the technical story — I need to know you understand what this did to my patients.”
level: 3
minutes: 10–15 min
storySoFar: >-
  It's Wednesday, April 15. Since April 6, SMS reminders have been in a soft launch at Lakeside's Westside clinic. On
  Monday and Tuesday, a time-zone bug sent 140 patients reminders showing their appointment one hour later than the
  real time. Dr. Mercer has asked for an urgent call.
facts:
  - label: What happened
    value: "Apr 13–14: 140 reminders showed the appointment 1 hour late. The reminder service used an old time-zone offset after daylight saving time started."
  - label: Impact
    value: "9 patients arrived an hour late and missed their visit; the front desk rebooked all 9. Lisa Chen's team took more than 30 calls."
    warn: true
  - label: Fixed
    value: "Fix deployed Tue Apr 14, 6 pm ET. A correction SMS went to all 140 patients on Wed at 8 am ET."
  - label: Prevention
    value: "New automated tests for daylight-saving dates. Before any reminder is sent, CareBook now checks its time against the Epic appointment time."
  - label: Offer
    value: "A daily reminder report to Lisa Chen for the next 2 weeks, and a written incident summary by Thu Apr 16."
yourGoal: >-
  Calm an upset client with LAST — listen fully, acknowledge the impact, explain the fix and prevention simply, and
  thank them — then agree on next steps.
mayAsk:
  - How do I know this won't happen again during the pilot?
  - Why did we find out from our patients and not from you?
  - Should we just turn reminders off?
script:
  - { step: Listen, line: "(Let Dr. Mercer finish without interrupting. Take notes.)" }
  - { step: Acknowledge, line: "You're right to be upset. Nine patients missed their visits and your front desk took the calls — I'm sorry, and that's on us." }
  - { step: Explain, line: "The cause was simple: after daylight saving time, our reminder service used the wrong time offset. We fixed it last night at 6 pm." }
  - { step: Solve, line: "All 140 patients got a corrected text this morning. From now on, every reminder is checked against the Epic time before it goes out." }
  - { step: Offer, line: "For the next two weeks, Lisa will get a daily reminder report, and I'll send you a written incident summary by tomorrow." }
  - { step: Thank, line: "Thank you for raising this quickly. Is there anything else you need from us before the pilot?" }
whatGood:
  - Listened without interrupting
  - Acknowledged the patient impact before explaining
  - Explained the fix and prevention in plain words
  - Offered a written summary with a date
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Dr. Alan Mercer, Chief Medical Information Officer at Lakeside Health — 12 primary-care clinics in Ohio that use Epic. Careful, clinical, protective of your patients.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Wednesday, April 15. SMS reminders have been in a soft launch at your Westside clinic since April 6. Lisa Chen told you patients showed up late because of wrong reminder times. You are upset.

  TODAY'S SCENARIO: Open angry: "Nine of my patients missed their appointments this week because of your reminders. I need to understand how this happened." Keep talking for the first minute. If the engineer interrupts you or starts with technical details before acknowledging the impact, get more upset and say "I don't need the technical story — I need to know you understand what this did to my patients." Calm down gradually once you hear a clear acknowledgment, the fix, and prevention.

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. Lakeside's CEO asked you this morning whether the pilot should be paused.
  2. You will calm down only after you hear an acknowledgment before any explanation.
  3. You want a written incident summary by Thursday that you can show the CEO.
  4. You are thinking about requiring Lakeside sign-off on any future change to reminders.

  CURVEBALLS — use these during the call:
  - Ask: "How do I know this won't happen again during the pilot?"
  - Ask: "Should we just turn reminders off?"

  DIFFICULTY: Level 3 — sceptical; push back, interrupt at pauses, ask hard questions, apply time pressure.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
