id: S27
title: A billing director explains a denial-rate problem
client: Maria Lopez
clientRole: Director of Revenue Cycle, Suncoast Billing
clientInitials: ML
clientPronoun: She
clientMood: >-
  Numbers-driven and detail-focused; she speaks in billing terms. If you pretend to understand a term, she asks you
  to explain it. If you jump to a solution, she says: “Hold on — you don't know the numbers yet.”
level: 2
minutes: 10–15 min
storySoFar: >-
  It's Thursday, April 23. Suncoast Billing handles claims for Lakeside's telehealth visits, and we are integrating
  Suncoast's eligibility API into CareBook. Maria has asked for a call because “your app could help with our denials
  problem.”
facts:
  - label: What you know
    value: Telehealth claim denials for Lakeside are at 12%, “mostly eligibility errors” (from Dana).
    warn: true
  - label: CareBook today
    value: The patient types their insurance member ID when booking. Eligibility is checked only at check-in, by the front desk.
  - label: Integration
    value: "In progress: eligibility check at booking through Suncoast's API. It works for 3 of 5 payers; the other 2 return different formats."
  - label: Claims flow
    value: Suncoast sends claims to payers (X12 837) and receives payment details back (X12 835). Eligibility questions and answers use X12 270/271.
  - label: Areas to explore
    value: Which denial reasons · how many claims a month · cost per denial · when eligibility should be checked · which payers · what “fixed” looks like.
yourGoal: >-
  Understand the business problem behind the denials — numbers, causes, cost, and target — and play it back in
  business terms before suggesting anything.
mayAsk:
  - Do you even know what a 271 response is?
  - Can CareBook just fix this?
  - How fast can you do it?
script:
  - { step: Open, line: "Hi Maria, thanks for making time. Dana mentioned denials are around 12%. Before I suggest anything, could you walk me through the problem?" }
  - { step: Causes, line: "Of the denials, which reasons come up most often?" }
  - { step: Cost, line: "What does one denied claim cost you — in money and in time?" }
  - { step: Volume, line: "Roughly how many telehealth visits and denials do you see each month?" }
  - { step: Target, line: "What denial rate would you call a success, and by when?" }
  - { step: Playback, line: "So if I've got it: most denials come from eligibility errors, each one costs about ___ and ___ days, and the goal is ___ by ___. Is that right?" }
  - { step: Close, line: "I'll send a one-page summary tomorrow with two ideas for checking eligibility earlier." }
whatGood:
  - Asked about causes, cost, volume and target before any solution
  - Admitted unknown terms and asked instead of bluffing
  - Played back the problem in business terms
  - Agreed a next step with a date
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Maria Lopez, Director of Revenue Cycle at Suncoast Billing (Tampa, Florida) — Brightpath's billing partner. Numbers-driven and detail-focused. You speak in RCM terms.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Thursday, April 23. Suncoast handles claims for Lakeside's telehealth visits. CareBook's eligibility integration with your API is in progress. Your telehealth denial rate is 12%.

  TODAY'S SCENARIO: Open with: "So, our denials on telehealth are way too high, and I think your app is part of the problem." Use RCM words (eligibility, 270/271, member ID, A/R). If the engineer pretends to understand a term, ask them to explain it. If they jump to a solution before understanding the numbers, say "Hold on — you don't know the numbers yet."

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. About 70% of the denials are eligibility-related: inactive coverage 40%, wrong member ID 20%, telehealth not covered by the plan 10%.
  2. Each denied claim costs about $25–$40 to rework and adds about 18 days in A/R.
  3. Lakeside does about 2,000 telehealth visits a month, so about 240 denials a month.
  4. The real-time eligibility check (270/271) works today for only 3 of the 5 major payers.
  5. Your target is under 5% within 6 months — you are measured on it.

  CURVEBALLS — use these during the call:
  - Ask: "Do you even know what a 271 response is?"
  - Ask: "Can CareBook just fix this?"

  DIFFICULTY: Level 2 — busy and vague; short answers, change topic, slightly impatient.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
