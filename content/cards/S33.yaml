id: S33
title: Explain a bug to a non-technical client in pyramid form
client: Dr. Alan Mercer
clientRole: Chief Medical Information Officer, Lakeside Health
clientInitials: AM
clientPronoun: He
clientMood: >-
  Careful, clinical, not technical. If you say “race condition” or “locking”, he'll stop you: “I'm sorry, what does
  that mean for my patients?”
level: 1
minutes: 10–15 min
storySoFar: >-
  It's Wednesday, March 11. On Monday, our QA engineer found a bug in staging: two patients could book the same
  appointment slot at the same moment. Dr. Mercer heard about it from Dana and wants to understand what it means for
  Lakeside's clinics.
facts:
  - label: What happened
    value: In testing, when two patients book the same slot within the same second, both could get a confirmation, a double booking. It happened 3 times in 400 test bookings.
    warn: true
  - label: Where
    value: Staging (test system) only. No real patients. CareBook isn't live at Lakeside yet.
  - label: The fix
    value: The system will “hold” a slot for a few seconds while one patient books it, so a second patient can't take it. The tech lead is fixing it by Thu Mar 12; QA retests on Fri Mar 13.
  - label: Impact
    value: None on the April 27 pilot. We're also adding an automatic test that tries double bookings in every release.
  - label: Main message
    value: “We found a double-booking bug in testing and are fixing it this week, before any patient could be affected.”
yourGoal: >-
  Explain the bug in pyramid form, main message first, then 3 supporting points, in plain words with no technical
  jargon.
mayAsk:
  - Could this happen after go-live?
  - What else haven't you found yet?
  - How do I explain this to my clinic managers?
script:
  - { step: Main message, line: "Here's the short version: we found a double-booking bug in testing, and we're fixing it this week, before any patient could be affected." }
  - { step: Point 1, line: "What happened: if two patients tried to book the same slot at the same moment, both could get a confirmation." }
  - { step: Point 2, line: "The fix: the system will hold the slot for a few seconds while one person books it. That's done Thursday and retested Friday." }
  - { step: Point 3, line: "To stop it coming back, we're adding an automatic check that tests double bookings in every release." }
  - { step: Check, line: "Does that answer your question, or would it help if I wrote two lines you can share with your clinic managers?" }
whatGood:
  - The main message in the first sentence
  - No jargon, explained in patient terms
  - Three clear supporting points
  - You offered something written to share
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Dr. Alan Mercer, Chief Medical Information Officer at Lakeside Health — 12 primary-care clinics in Ohio that use Epic. Careful, clinical, not technical.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Wednesday, March 11. Dana mentioned a "booking bug" to you. Your clinics go live with CareBook in a pilot on April 27.

  TODAY'S SCENARIO: Open with "Dana mentioned some kind of booking bug. What's going on?" If I use technical words like "race condition" or "locking", say "I'm sorry — what does that mean for my patients?"

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. Two years ago Lakeside's old phone booking system double-booked patients, and patients complained to the board.
  2. You want two plain sentences you can share with your clinic managers.
  3. You'd like to know how the team will catch problems like this before go-live.

  CURVEBALLS — use these during the call:
  - Ask: "Could this happen after go-live?"
  - Ask: "What else haven't you found yet?"

  DIFFICULTY: Level 1 — friendly and patient; answer my questions fully.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
