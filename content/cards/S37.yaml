id: S37
title: Confirm acceptance criteria with the client
client: Dana Brooks
clientRole: VP of Product, Brightpath
clientInitials: DB
clientPronoun: She
clientMood: >-
  Busy, decisive, dislikes technical wording. She agrees quickly with most things but corrects one detail. If you
  read the criteria in technical language, she'll say: “In plain English, please.”
level: 2
minutes: 10–15 min
storySoFar: >-
  It's Thursday, April 2. After yesterday's discovery, Dana agreed that new-patient video booking will be built in
  Sprint 7 (May 11–22), after the pilot. You drafted the first user story and 4 acceptance criteria. Dana has 10
  minutes to confirm them.
facts:
  - label: User story
    value: "“As a new patient, I want to book a video visit online so that I don't have to wait on the phone.”"
  - label: AC 1
    value: "Given a new patient, when they choose a provider, then only providers accepting new patients are shown."
  - label: AC 2
    value: "Given the booking form, when the patient submits, then insurance member ID and date of birth are required before the visit is confirmed."
  - label: AC 3 and AC 4
    value: "Patients under 18 are asked to call the clinic (phase 1). Every booked visit gets an SMS and email confirmation within 1 minute."
  - label: Open questions
    value: "1) If insurance can't be verified — book anyway, or block? 2) Who approves the new patient in Epic, and how fast?"
    warn: true
  - label: Timing
    value: "Planned for Sprint 7 (May 11–22). Anything new today goes to a later sprint."
yourGoal: >-
  Get a clear yes or no on each acceptance criterion, close the 2 open questions, and confirm everything in writing.
mayAsk:
  - Can we add one more thing?
  - Why can't this go into the pilot?
  - What happens if the insurance check fails?
script:
  - { step: Open, line: "Hi Dana, this is a quick one. I'd like your yes or no on four acceptance criteria for new-patient video booking, and answers to two open questions." }
  - { step: Walk through, line: "First: only providers accepting new patients show up. Yes?" }
  - { step: Check, line: "Second: insurance member ID and date of birth are required before we confirm the visit. Is that right for every new patient?" }
  - { step: Open question, line: "If insurance can't be verified, should we still book the visit and flag it for the front desk, or block the booking?" }
  - { step: Scope, line: "Anything new today goes on the list for Sprint 8, so Sprint 7 stays on track. Is that okay?" }
  - { step: Close, line: "I'll send the final story and criteria within the hour. If I don't hear back by Friday noon your time, I'll treat them as approved." }
whatGood:
  - A clear yes or no on each criterion
  - Captured the self-pay and “flag, don't block” answers
  - Parked new asks for a later sprint
  - Written confirmation with an “approved unless corrected by” date
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: Dana Brooks, VP of Product at Brightpath Health (Austin, Texas). Busy, decisive, dislikes technical wording.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Thursday, April 2. Yesterday you agreed that new-patient video booking will be built in Sprint 7 (May 11–22), after the pilot on April 27.

  TODAY'S SCENARIO: Open with "Okay, I've got ten minutes. What do you need from me?" Agree quickly with most criteria, but correct one detail. If I read the criteria in technical language, say "In plain English, please."

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. About 10% of new patients are self-pay. For them, insurance is not required — they choose "self-pay" instead. (This changes AC 2.)
  2. If insurance can't be verified, book the visit anyway and flag it for the front desk. Never block a patient.
  3. Lakeside's front desk (Lisa Chen's team) must approve each new patient in Epic within 1 business day; until then the visit shows as "pending".
  4. You want the confirmation SMS in Spanish too — but only mention it if I ask about language.

  CURVEBALLS — use these during the call:
  - Ask: "Can we also let them upload a photo of their insurance card?"
  - Ask: "Why do you need this in writing — isn't this call enough?"

  DIFFICULTY: Level 2 — busy and vague; short answers, change topic, slightly impatient.

  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
