id: S42
title: The same technical story to two audiences
client: Dr. Alan Mercer, then Kevin Walsh
clientRole: CMIO, Lakeside Health · CTO, Brightpath Health
clientInitials: AM
clientPronoun: They
clientMood: >-
  Two people, one after the other. Dr. Mercer is careful, clinical and not technical; he cares about the front desk
  and patient safety. Kevin is technical, precise and challenges decisions.
level: 2
minutes: 10–15 min
storySoFar: >-
  It's Tuesday, April 28. Dr. Mercer and Kevin both want to understand the check-in fix before the May 4 pilot, but
  they care about very different things. The facts are the same; you tell the story twice, at two levels.
facts:
  - { label: The story, value: "Check-in took about 6 s because the page waited for a live Suncoast eligibility lookup. Each result is now cached for 24 hours. Check-in loads in 0.8 s." }
  - { label: For Dr. Mercer, value: "Cares about the front desk and patient safety. At 8 am, 15–20 patients arrive within 30 minutes, so slow check-in created a line." }
  - { label: For Kevin, value: "Cache in Redis (already approved for sessions), 24-hour expiry, keyed by patient and insurance plan, cleared on any insurance change. Encrypted at rest, same HIPAA-covered AWS account, no PHI in logs." }
  - { label: Numbers, value: "Median 6 s → 0.8 s; slowest 5%: 7.8 s → 1.2 s (load test Apr 23, simulating 200 check-ins per clinic per day)." }
  - { label: If Suncoast is down, value: "Check-in uses the last saved result, shows “eligibility not refreshed” to staff, and retries in the background every 5 minutes." }
  - { label: Open item, value: "Pre-loading (“warming”) the cache at 7:45 am ET for the day's booked patients: planned, not built. About 1 day of work.", warn: true }
yourGoal: >-
  Tell the same story twice, plain and outcome-first for Dr. Mercer, then precise and technical for Kevin, without
  changing any fact.
mayAsk:
  - Could a patient be told they're covered when they're not?
  - Why 24 hours and not 1 hour?
  - What happens when Suncoast is down?
script:
  - { step: "Mercer: open", line: "Dr. Mercer, a quick update before the pilot: check-in now takes under a second instead of six, so the 8 am line at the front desk moves much faster." }
  - { step: "Mercer: safety", line: "We keep each patient's insurance check for one day. If coverage changes, Suncoast checks again before billing, so no claim goes out on old information." }
  - { step: "Mercer: check", line: "Does that cover what your front desk needs for May 4?" }
  - { step: "Kevin: open", line: "Kevin, the technical version: we cache Suncoast eligibility responses in Redis for 24 hours, keyed by patient and plan, and clear them on any insurance change." }
  - { step: "Kevin: risks", line: "It's encrypted at rest in the same AWS account, with nothing identifying in the logs. If Suncoast is down, we serve the last result, flag it to staff, and retry every 5 minutes." }
  - { step: "Kevin: ask", line: "One open item: warming the cache at 7:45 am. It's about a day of work. Can I get your OK to add it before May 4?" }
whatGood:
  - Plain business and patient language with Dr. Mercer
  - Precise design, failure and security answers for Kevin
  - Facts identical in both versions
  - A clear ask to Kevin on the open item
prompt: |
  You are role-playing a US client on a video call with me. Stay in character until I say "End the call."

  WHO YOU ARE: You play two people, one after the other. First, Dr. Alan Mercer, Chief Medical Information Officer at Lakeside Health — careful, clinical, not technical. Then Kevin Walsh, CTO of Brightpath Health — technical, precise, challenges decisions.

  PROJECT CONTEXT: My company is the engineering partner of Brightpath Health, a US telehealth company. We are building CareBook v2 — patient booking (in-person and video), SMS reminders, intake forms and a clinic schedule view — synced with the clinic's Epic EHR, with insurance eligibility checks through Suncoast Billing. The launch customer is Lakeside Health (12 primary-care clinics in Ohio). Everything is made up; no real patient data.

  WHERE WE ARE NOW: Tuesday, April 28. The CareBook pilot at 3 Lakeside clinics goes live on May 4. The team has just fixed a slow check-in page.

  TODAY'S SCENARIO: Start as Dr. Mercer: "I hear check-in was slow — should I be worried?" When I say "Now Kevin", switch to Kevin: "Walk me through the cache design." If I use technical words with Dr. Mercer, ask what they mean. If I stay vague with Kevin, ask "Specifically how?"

  HIDDEN FACTS — reveal each one only if my questions lead to it:
  1. Dr. Mercer: an old vendor's system once showed patients as insured when they weren't, causing surprise bills. That's the real worry.
  2. Dr. Mercer: the 8 am rush at Westside is the front desk's biggest complaint.
  3. Kevin: reusing Redis is fine, but you want the expiry time justified.
  4. Kevin: you worry that after rollout, all 12 clinics will hit Suncoast at once at 8 am.

  CURVEBALLS — use these during the call:
  - As Dr. Mercer: "Could a patient be told they're covered when they're not?"
  - As Kevin: "Why 24 hours? Why not one hour?"

  DIFFICULTY: Level 2 — busy and vague; short answers, change topic, slightly impatient.


  HOW TO BEHAVE
  - Speak like a real American business person: natural speed, short sentences, everyday expressions.
  - Keep each turn short (1–3 sentences), like a real call.
  - Don't volunteer information; give details only when I ask good questions.
  - If I use technical jargon, ask me what it means for your business.
  - If I talk for more than 45 seconds without getting to the point, cut in at my next pause.

  WHEN I SAY "End the call", step out of character and give me feedback:
  1. Score me 1–5 on each criterion that came up: opening and agenda, answer-first structure, questions asked, playback, business link, trade-offs, handling unknowns, risks and bad news, disagreement, closing and next steps.
  2. List the hidden facts and tell me which ones I uncovered.
  3. Quote 2 things I said well, and 2 things I should have said differently — with the better sentence.
  4. Tell me roughly how often I used filler words ("um", "basically", "actually", "like").
  5. Give me ONE thing to focus on in my next call.
