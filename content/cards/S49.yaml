  - { step: Headline, line: "My headline: I'm ready to work directly with a client, with one area I'm still building: handling a sceptical CTO under time pressure." }
  - { step: Communicate, line: "I led the May 20 weekly sync and sent the recap in under two hours. My score moved from 2 to 4." }
