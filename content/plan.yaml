# The plan model shared by all lessons: phases, the Client Readiness Model (4 pillars, 14 behaviours),
# the 1–5 self-rating scale and the call rubric. Rewritten for the portal from PDF pages 4–6, 9 and 12.

phases:
  - { number: 1, name: Foundation, fromDay: 1, toDay: 20 }
  - { number: 2, name: Client craft, fromDay: 21, toDay: 40 }
  - { number: 3, name: Live reps, fromDay: 41, toDay: 65 }

pillars:
  - { id: understand, name: Understand, summary: Find the real need and link your work to business outcomes. }
  - { id: communicate, name: Communicate, summary: Speak and write clearly. Answer first. }
  - { id: own, name: Own, summary: "Raise risks early, share bad news with a plan, follow up." }
  - { id: stand_firm, name: Stand firm, summary: Handle unknowns calmly and disagree professionally. }

behaviours:
  - id: U1
    pillar: understand
    name: Decode an unclear requirement
    soundsLike: "“Before I suggest anything, can I ask a few questions? Who will use this, and what problem are they facing today?”"
    watchOut: Jumping straight to a solution or an estimate.
  - id: U2
    pillar: understand
    name: Play back what you understood
    soundsLike: "“So what I'm hearing is X, Y and Z. Did I get that right?”"
    watchOut: Saying “okay, got it” and assuming.
  - id: U3
    pillar: understand
    name: Link your work to business outcomes
    soundsLike: "“Caching the insurance lookup cuts check-in from 6 seconds to under 1. Your front desk checks in about 200 patients a day.”"
    watchOut: Only technical talk about frameworks, tables and APIs.
  - id: U4
    pillar: understand
    name: Use AI to prepare, summarise and think
    soundsLike: You arrive with a one-page prep and send a recap within 2 hours, AI-assisted and checked by you.
    watchOut: Walking in cold, sending raw AI text, or putting patient data into AI tools.
  - id: C1
    pillar: communicate
    name: Speak in a clear structure
    soundsLike: "“Short answer: yes, by Friday. Two things make that possible…”"
    watchOut: A long background story before the point.
  - id: C2
    pillar: communicate
    name: Write clearly
    soundsLike: The subject line states the ask. The bottom line is in the first two lines. Bullets. One screen.
    watchOut: Walls of text, a buried ask, “Please do the needful.”
  - id: C3
    pillar: communicate
    name: Explain trade-offs simply
    soundsLike: "“Option A takes 2 days but is harder to change later. Option B takes 5 days but scales. I recommend B because you're adding three clinics next quarter.”"
    watchOut: Options with no recommendation, or jargon.
  - id: C4
    pillar: communicate
    name: Give a short status update
    soundsLike: Done, next, blocked, risk, in under 60 seconds.
    watchOut: Listing every task you touched.
  - id: O1
    pillar: own
    name: Raise risks early
    soundsLike: "“Heads-up: the EHR sandbox access isn't here yet. If it isn't ready by Wednesday, the demo moves. I've already chased your IT team.”"
    watchOut: Staying silent and hoping it sorts itself out.
  - id: O2
    pillar: own
    name: Deliver bad news without hiding
    soundsLike: Headline first, then the impact, your options, what you need from them, and when you'll update them next.
    watchOut: Hiding it in a long email, over-apologising, or blaming.
  - id: O3
    pillar: own
    name: Own the follow-up
    soundsLike: "“I'll send the summary by 5 pm your time and confirm the API details by Thursday.” And then you do it."
    watchOut: “Someone will check”, or waiting to be reminded.
  - id: O4
    pillar: own
    name: Speak as an owner
    soundsLike: "“My recommendation is…”, “I'll handle…”, “Here's what I suggest we do next.”"
    watchOut: “Should I…?”, “Whatever you say”, waiting for instructions.
  - id: S1
    pillar: stand_firm
    name: Say “I don't know, I'll check” calmly
    soundsLike: "“Good question. I don't have that number with me. I'll confirm by tomorrow noon your time.”"
    watchOut: Guessing, freezing, or long apologies.
  - id: S2
    pillar: stand_firm
    name: Disagree professionally
    soundsLike: "“I see why you want to skip testing to hit Friday. My concern is wrong appointment times reaching patients. Could we ship the core flow Friday and the rest on Tuesday?”"
    watchOut: Agreeing silently and then missing the date, or arguing personally.

scale:
  - { score: 1, meaning: "I avoid it, or I freeze when it happens." }
  - { score: 2, meaning: "I do it only when prompted, and it feels awkward." }
  - { score: 3, meaning: I can do it when I have prepared. }
  - { score: 4, meaning: I do it naturally on most calls. }
  - { score: 5, meaning: "I do it well under pressure: hard questions, an upset client, a senior audience." }

rubric:
  - { number: 1, name: Opening and agenda, pillar: communicate, anchors: { one: "Starts abruptly, or waits for the client to lead", three: "Greets the client, states the purpose and agenda", five: "Warm start, clear purpose, invites the client's input, checks the time" } }
  - { number: 2, name: Answer-first structure, pillar: communicate, anchors: { one: "Background first, answer buried", three: "Answer first most of the time", five: "Always answer first, with 2–3 clear points; concise" } }
  - { number: 3, name: Questions asked, pillar: understand, anchors: { one: "Few or none; mostly yes/no", three: "Several open questions; some follow-up", five: "Uncovers the real goal and success metric with a clear question funnel" } }
  - { number: 4, name: Playback, pillar: understand, anchors: { one: "None", three: "Plays back at the end", five: "Plays back at key moments and confirms understanding" } }
  - { number: 5, name: Business link, pillar: understand, anchors: { one: "Only technical talk", three: "Sometimes mentions business impact", five: "Every key point tied to a client outcome or metric" } }
  - { number: 6, name: Trade-offs, pillar: communicate, anchors: { one: "Options with no recommendation, or jargon", three: "Clear options and a recommendation", five: "Simple, business-framed trade-off; the client decides quickly" } }
  - { number: 7, name: Handling unknowns, pillar: stand_firm, anchors: { one: "Guesses, freezes, or over-apologises", three: "Admits it and commits to follow up", five: "Calm; shares what is known; gives a clear follow-up time" } }
  - { number: 8, name: Risks and bad news, pillar: own, anchors: { one: "Hides or delays it", three: "Raises it when asked", five: "Raises it proactively, with impact, options, and the next update time" } }
  - { number: 9, name: Disagreement, pillar: stand_firm, anchors: { one: "Silently agrees, or argues", three: "States the concern politely", five: "Acknowledges their goal, uses facts, offers an alternative, reaches agreement" } }
  - { number: 10, name: Closing and next steps, pillar: own, anchors: { one: "Ends without next steps", three: "Lists the next steps", five: "Recaps decisions, owners and dates; ends on time" } }
  - { number: 11, name: Written follow-up, pillar: own, anchors: { one: "None, or late", three: "Sent the same day", five: "Sent within 2 hours; bottom line first; action items with owners and dates" } }
