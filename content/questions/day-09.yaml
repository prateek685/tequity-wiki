# Day 9 quiz pool: Thursday, March 12. Plain US business English, Smart Brevity, short sentences, the Level 2
# rerun with a busy, vague Dana. Shows 5 of 10.
pool: day-09
questions:
  - id: D09-01
    type: mcq
    stem: You need Lakeside's compliance team to approve the reminder opt-out wording. Which line will a US reader act on fastest?
    options:
      - text: "“Kindly revert back at the earliest.”"
        correct: false
        explanation: “Revert back” confuses American readers, and “at the earliest” gives no date.
      - text: "“Kindly do the needful regarding the opt-out wording.”"
        correct: false
        explanation: “Do the needful” doesn't say what the needful is. Name the action.
      - text: "“Could you approve the opt-out wording by Friday noon Central? We need it before reminders go to pilot patients.”"
        correct: true
        explanation: A specific action, a date with a time zone, and one line of why.
      - text: "“Please approve today itself.”"
        correct: false
        explanation: “Today itself” reads oddly to Americans, and there's no reason given.
    source: { quote: "Could you please [specific action] by [date]?", page: 151 }

  - id: D09-02
    type: mcq
    stem: "A teammate drafts this to Dana: “Can we prepone the demo dry run to 3 pm?” Which version is best?"
    options:
      - text: "“Can we prepone the demo dry run to 3 pm?” (it's fine as it is)"
        correct: false
        explanation: Most Americans don't know “prepone”. Dana may read it as “postpone”.
      - text: "“Can we move the demo dry run earlier, to 3 pm Central today?”"
        correct: true
        explanation: Plain words, and the time zone removes the second question.
      - text: "“Can we reschedule the dry run?”"
        correct: false
        explanation: Clear words, but it doesn't say when. Dana has to ask.
      - text: "“Kindly let us know if it is possible to advance the dry run timing.”"
        correct: false
        explanation: Indirect and formal, and still no time.
    source: { quote: "Can we move the call earlier?", page: 151 }

  - id: D09-03
    type: mcq
    stem: >-
      You're not sure whether Kevin wants reminder logs kept for 30 or 90 days, and you need to know before Sprint 4.
      Which message to Kevin is clearest?
    options:
      - text: "“I have a doubt regarding the log retention.”"
        correct: false
        explanation: To an American, “a doubt” sounds like you distrust the decision. And the question isn't asked.
      - text: "“Small question, no rush, whenever you get time, about logs.”"
        correct: false
        explanation: No question and no date, so it will sit unanswered.
      - text: "“Please confirm the needful on logs.”"
        correct: false
        explanation: “The needful” leaves Kevin to guess what you need.
      - text: "“I have a question: should we keep reminder logs for 30 or 90 days? Could you reply by Monday, March 16?”"
        correct: true
        explanation: The question itself, with the options and a date.
    source: { quote: "I have a question.", page: 151 }

  - id: D09-04
    type: mcq
    stem: The build broke this morning, and the demo dry run with Dana moves from 1 pm to 2 pm Central. Which message is best?
    options:
      - text: "“Sorry, sorry, so sorry Dana, the build broke and we are very sorry for the inconvenience.”"
        correct: false
        explanation: Four apologies and no plan. It makes a one-hour slip sound like a crisis.
      - text: "“Sorry for the late change: the dry run moves to 2 pm Central today. The build is fixed and the demo isn't affected.”"
        correct: true
        explanation: One short apology, then the new time and the impact.
      - text: "“We will try to do the dry run maybe at 2 pm hopefully.”"
        correct: false
        explanation: “Try”, “maybe” and “hopefully” in one sentence. Dana can't plan with it.
      - text: Say nothing and start at 2 pm
        correct: false
        explanation: Dana waits on an empty call at 1 pm. Silence is worse than a short apology.
    source: { quote: "One short apology, then the plan.", page: 151 }

  - id: D09-05
    type: mcq
    stem: Dana wants one short note for her CEO before tomorrow's demo, about the reminders. Which is best?
    options:
      - text: "“FYI reminders done pls chk.”"
        correct: false
        explanation: Short, but abbreviations and no reason to care. A CEO won't act on it.
      - text: "“SMS reminders are live in staging. Why it matters: patients get a text 48 hours and 2 hours before each visit, our main tool against no-shows. You'll see them in tomorrow's demo.”"
        correct: true
        explanation: The news first, why it matters in one line, then what to expect.
      - text: A paragraph on the carrier delay, the templates and the test plan, with the news at the end
        correct: false
        explanation: The point is buried under history the CEO doesn't need.
      - text: A list of nine bullets, one for every reminder task
        correct: false
        explanation: Every task you touched, with no headline. He can't tell what matters.
    source: { quote: "Status updates, recaps, weekly reports.", page: 35 }

  - id: D09-06
    type: mcq
    stem: Lisa Chen will copy your note into a notice for front-desk staff. Which version is easiest to read?
    options:
      - text: "“Commencing with the forthcoming pilot implementation, patients will be in receipt of automated SMS-based appointment notifications.”"
        correct: false
        explanation: Long words and a long sentence. Front-desk staff will skim past it.
      - text: "“From the pilot, patients get a text 2 days and 2 hours before their visit. They can reply to cancel.”"
        correct: true
        explanation: Short sentences, everyday words, active voice. A low reading grade.
      - text: "“Reminders, which as previously discussed will be sent via SMS at configured intervals subject to consent, go live with the pilot.”"
        correct: false
        explanation: One sentence carrying five ideas. Split it.
      - text: "“SMS reminders via the toll-free number (TCPA-compliant) go live at T-48h and T-2h.”"
        correct: false
        explanation: Jargon and abbreviations the front desk doesn't use.
    source: { quote: "aim for grade 8 or below", page: 35 }

  - id: D09-07
    type: scenario
    clientLine: "“Uh-huh. Hey, unrelated, is the CEO invite for tomorrow out? Anyway. Reminders. Working or not?”"
    stem: Dana is busy and vague today, jumping between topics. What's the best reply?
    options:
      - text: "“Let me start from the beginning so we're on the same page…”"
        correct: false
        explanation: A busy client won't wait. She asked a yes-or-no question.
      - text: "“Yes, working: live in staging since this morning, and a test text is on your phone. On the invite: it went out yesterday.”"
        correct: true
        explanation: Answer first, one fact, then a one-line answer to her side question. Short, like her.
      - text: "“Sorry, which question should I answer first?”"
        correct: false
        explanation: Makes her do the sorting. Answer both, briefly.
      - text: "“Can we keep to the agenda, please?”"
        correct: false
        explanation: Correcting a busy client sounds rigid. A one-line answer keeps her with you.
    source: { quote: "Busy and vague. Gives short answers, changes topic, is slightly impatient.", page: 14 }

  - id: D09-08
    type: scenario
    clientLine: "“Your teammate wrote ‘will revert back today itself.’ Is he replying, or undoing something?”"
    stem: Dana is confused by a message from your team. What do you say?
    options:
      - text: "“It's just how we say it. It means the same thing.”"
        correct: false
        explanation: Defends the phrase instead of fixing the confusion for the reader.
      - text: "“He's undoing the change, I think? Let me check.”"
        correct: false
        explanation: Guessing about your own team's message makes it worse.
      - text: "“Please ask him directly.”"
        correct: false
        explanation: Passes the problem back to the client.
      - text: "“He means he'll reply to you today, by 5 pm Central. Sorry for the confusion.”"
        correct: true
        explanation: Clarifies in plain words, adds a time, and one short apology.
    source: { quote: "Revert back to me.", page: 151 }

  - id: D09-09
    type: written
    stem: >-
      Rewrite this message to Dana in plain US business English, point first (1–2 sentences): “Kindly note that as
      discussed the reminders are now basically working in staging environment itself, please do let us know your
      feedback at the earliest.”
    modelAnswer: >-
      Reminders are live in staging, and a full test reached your phone this morning. Could you send any feedback on
      the text by Friday 9 am Central, before the demo?
    scoringPoints:
      - Starts with the news, without “kindly note” or “as discussed”
      - Turns “at the earliest” into a specific ask with a date and time zone
      - Drops filler (basically, itself) and keeps sentences short
    source: { quote: "Phrases that can confuse American readers", page: 34 }

  - id: D09-10
    type: written
    stem: >-
      Dana says, “My CEO asked what ‘carrier verification’ even is. One plain sentence, please.” Write it, as if for
      a reader with no technical background.
    modelAnswer: >-
      Before a business can send text messages in the US, the phone companies must approve its number; ours was
      approved on Wednesday, and reminders went live this morning.
    scoringPoints:
      - Explains it in everyday words (phone companies approve the number), with no jargon
      - Adds the outcome the CEO cares about (approved, reminders live)
      - One clear sentence a reader in Boston understands on one read
    source: { quote: "Carriers must verify any number that sends business texts.", page: 38 }
