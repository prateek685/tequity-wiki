# Day 38 quiz pool: Wednesday, April 22. Weekly status to Dana in 2 minutes: Green, Amber or Red with one line on
# why, highlights, next week, risks with plans, decisions, the CEO sentence, the written report. Shows 5 of 10.
pool: day-38
questions:
  - id: D38-01
    type: mcq
    stem: "Dana: “I've literally got two minutes — where are we?” What's your first sentence?"
    options:
      - text: "“So this week QA ran 212 test cases, and on Monday we got AWS access, and…”"
        correct: false
        explanation: Details first. She still doesn't know if May 4 is safe.
      - text: "“Overall we're Amber: May 4 is on track, but tight.”"
        correct: true
        explanation: The color and why, in one sentence.
      - text: "“Good, good. Pretty much on track I think.”"
        correct: false
        explanation: Vague, and hides the risk.
      - text: "“Where would you like me to start?”"
        correct: false
        explanation: Hands her the structure when she has no time.
    source: { quote: "Open with: \"I've literally got two minutes — where are we?\"", page: 108 }

  - id: D38-02
    type: mcq
    stem: "Dana pushes back: “Why Amber? Sounds Green to me.” What's the best reply?"
    options:
      - text: "“You're right, let's call it Green.”"
        correct: false
        explanation: Changes the color to please her while the risk is still open.
      - text: "“Because that risk still needs your decision. If you approve the manual fallback, I'd call it Green.”"
        correct: true
        explanation: Explains the color and shows the exact step that turns it Green.
      - text: "“Amber is just our default.”"
        correct: false
        explanation: A color that means nothing helps nobody.
      - text: "“Better safe than sorry.”"
        correct: false
        explanation: No reason she can act on.
    source: { quote: "Because that risk still needs your decision. If you approve the manual fallback, I'd call it Green.", page: 160 }

  - id: D38-03
    type: mcq
    stem: Which risk line belongs in the weekly status?
    options:
      - text: "“Suncoast is having some issues.”"
        correct: false
        explanation: No impact, no plan.
      - text: "“Suncoast's eligibility doesn't work yet for 2 of 5 payers → the front desk checks those manually during the pilot.”"
        correct: true
        explanation: The risk and what we're doing about it, in one line.
      - text: "“Suncoast's API returns non-standard 271 payloads for some payer IDs.”"
        correct: false
        explanation: Jargon. A VP can't decide anything from it.
      - text: "“Risks: none.”"
        correct: false
        explanation: Hiding a known risk turns Amber into a surprise Red.
    source: { quote: "Risks and what we're doing about them", page: 161 }

  - id: D38-04
    type: mcq
    stem: "Dana: “Just give me the one sentence for my CEO.” What do you say?"
    options:
      - text: "“We're on track for May 4, with one known risk that has a plan.”"
        correct: true
        explanation: One sentence she can repeat word for word.
      - text: "“Tell him everything's fine.”"
        correct: false
        explanation: Not true, and it'll come back to her.
      - text: "“It's complicated, maybe I should join the call?”"
        correct: false
        explanation: She asked for one sentence, not a meeting.
      - text: "“180 of 212 test cases passed, the Epic fix passed regression, and production access is done.”"
        correct: false
        explanation: Facts, but no answer to “are we OK?”
    source: { quote: "If you need one sentence: we're on track for May 4, with one known risk that has a plan.", page: 107 }

  - id: D38-05
    type: mcq
    stem: How do you end the two minutes?
    options:
      - text: "“That's it. Any questions?”"
        correct: false
        explanation: Leaves the decisions you need unasked.
      - text: "“I need two things by Friday: your OK on the manual fallback, and who should join the go/no-go.”"
        correct: true
        explanation: Clear decisions with a deadline.
      - text: "“Let me know if you need anything from me.”"
        correct: false
        explanation: Backwards. You need something from her.
      - text: "“We'll figure out the rest.”"
        correct: false
        explanation: The fallback is her decision, not yours.
    source: { quote: "Decisions needed 1) Approve the manual fallback for 2 payers by Fri. 2) Confirm go/no-go attendees by Fri.", page: 107 }

  - id: D38-06
    type: mcq
    stem: On another project, the integration is two weeks behind, the launch date will be missed, and you have no plan yet. Which status is honest?
    options:
      - text: "Green, so the client doesn't panic."
        correct: false
        explanation: A Green that turns Red later is what loses trust.
      - text: "Amber, because you're working on it."
        correct: false
        explanation: Amber means at risk with a plan in place. You have no plan.
      - text: "Red: off track, and we need help, with what you need from the client."
        correct: true
        explanation: Red is for off track and needing help. Saying it early gives them time to act.
      - text: "No color this week."
        correct: false
        explanation: Leaving it out makes the reader assume the worst, or the best.
    source: { quote: "Overall status: Green (on track) / Amber (at risk, plan in place) / Red (off track, need help), with one line on why.", page: 101 }

  - id: D38-07
    type: scenario
    clientLine: "“Bottom line — are we OK for May 4?”"
    stem: You're 90 seconds in, still on the test results. What do you say?
    options:
      - text: "“Let me just finish the testing part, it's important…”"
        correct: false
        explanation: She asked for the bottom line twice now.
      - text: "“Yes, on track, but tight. One risk with a plan, and I need your OK on it by Friday.”"
        correct: true
        explanation: Answer first, the risk and the ask, in one breath.
      - text: "“It depends on a lot of things.”"
        correct: false
        explanation: True of every project. Tells her nothing.
      - text: "“I think so? Probably?”"
        correct: false
        explanation: Sounds unsure about your own project.
    source: { quote: "If the engineer goes past 2 minutes or starts with details, cut in at the next pause: \"Bottom line — are we OK for May 4?\"", page: 108 }

  - id: D38-08
    type: scenario
    clientLine: "“Which two payers? Maria complained about denials last month.”"
    stem: You know which two payers fail. What do you do?
    options:
      - text: "Name the two payers, then say the front desk checks them by hand during the pilot, so no patient is booked without a check."
        correct: true
        explanation: Answers the question and links it to what worries her.
      - text: "Explain the different response formats in detail."
        correct: false
        explanation: She's worried about denials, not formats.
      - text: "“Don't worry about Maria.”"
        correct: false
        explanation: Dismisses a real concern of a partner.
      - text: "“I'll find out.”"
        correct: false
        explanation: You already know. Delaying sounds evasive.
    source: { quote: "The Suncoast risk worries you most, because Maria Lopez complained about denials last month.", page: 108 }

  - id: D38-09
    type: written
    stem: >-
      Dana approved the fallback on the call and named Kevin and herself for the go/no-go. Write the “Decisions needed”
      line and the “Overall” line of your written report.
    modelAnswer: >-
      Overall: GREEN — May 4 is on track; the one open risk now has an approved plan (it was AMBER until Dana approved
      the manual eligibility fallback today). Decisions needed: none — go/no-go attendees confirmed: Dana and Kevin.
    scoringPoints:
      - Updates the color to match the decision made on the call, and says what changed
      - Writes “none” for decisions instead of leaving the line out, and records the attendees
      - Short and specific, with no new claims
    source: { quote: "Overall: GREEN — May 4 is on track; the one open risk now has an approved plan.", page: 161 }

  - id: D38-10
    type: written
    stem: >-
      Kevin wasn't on the call and asks you in Slack: “Is the pilot OK? Dana mentioned a Suncoast thing.” Reply in
      2–3 sentences.
    modelAnswer: >-
      Yes, May 4 is on track. Suncoast's eligibility check doesn't work yet for 2 of 5 payers, so for those the front
      desk checks eligibility by hand during the pilot; Dana approved that today. Nothing needed from you before the
      go/no-go on Wed Apr 29.
    scoringPoints:
      - Answers “is it OK?” first
      - Gives the risk with its approved plan in plain words
      - Tells him what, if anything, he needs to do, with a date
    source: { quote: "Plan: for those payers, the front desk checks eligibility manually during the pilot.", page: 107 }
