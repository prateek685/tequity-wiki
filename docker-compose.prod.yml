# Production stack for Tequity.wiki: web server (Caddy), API, worker, PostgreSQL 18 and Redis 8.
# Do not run this by hand: `./deploy.sh` checks .env.production and starts it. See DEPLOY.md.
# (docker-compose.yml, next to this file, is only for local development.)
name: tequity-wiki

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  WORKER_HEALTH_PORT: "3001"
  PORTAL_ORIGIN: ${PORTAL_ORIGIN:?Set PORTAL_ORIGIN in .env.production}
  TRUST_PROXY: "1"
  DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/portal
  REDIS_URL: redis://redis:6379
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:?Set ALLOWED_EMAIL_DOMAIN}
  COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_SCORING_MODEL: ${LLM_SCORING_MODEL:-claude-haiku-5-5}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: portal
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/..., so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8.10
    restart: unless-stopped
    # BullMQ needs noeviction: an evicted key would silently lose a job.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Runs once per deploy, before the API and worker: migrations, database role, first admin, content.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    restart: "no"
    environment:
      <<: *app-env
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/portal
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  # The only service reachable from outside: serves the app, forwards /api to the API, handles HTTPS.
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-:80}
      API_UPSTREAM: api:3000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  internal:
