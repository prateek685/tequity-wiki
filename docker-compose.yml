# Local development services. Start with: docker compose up -d
# The API, worker and web app run on your machine with `pnpm dev` (see README).
name: client-ready-portal

services:
  # ── PostgreSQL 18 ────────────────────────────────────────────
  postgres:
    image: postgres:18.6
    container_name: client-ready-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-4132}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/..., so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - client-ready-network

  # ── Redis 8 ──────────────────────────────────────────────────
  redis:
    image: redis:8.10
    container_name: client-ready-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-4179}:6379"
    # BullMQ needs noeviction: an evicted key would silently lose a job.
    command: >-
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - client-ready-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  client-ready-network:
    driver: bridge
