<template id="t0">
  <div><div class="kicker">Day 1 · Lesson 1 of 6 · 8 min</div><h1>Meet CareBook, your project for the next 90 days</h1></div>
  <p class="lead">It's Monday, March 2. You're the lead engineer on CareBook, and until today your delivery manager ran every client call. From today, the client hears from you. Every call and message in this course happens on this one project, so get to know it the way you'd learn a real client account.</p>

  <section>
    <h2>The project</h2>
    <p class="body">Brightpath Health is a US telehealth company. We're their engineering partner, building CareBook v2: a patient app for booking in-person or video visits, SMS reminders and intake forms, plus a web portal where clinic staff manage schedules. CareBook syncs appointments with the clinic's Epic health record and checks insurance through Suncoast Billing.</p>
  </section>

  <div class="card">
    <dl class="kv">
      <dt>Launch customer</dt><dd>Lakeside Health, 12 primary-care clinics in Ohio</dd>
      <dt>Pilot</dt><dd><b>Monday, April 27</b> at 3 Lakeside clinics, then all 12</dd>
      <dt>Built with</dt><dd>React Native patient app, React web portal, Node.js APIs on AWS</dd>
      <dt>Why it matters</dt><dd>No-show rate is 18% (target under 10%). Booking by phone takes about 7 minutes (online target: 2).</dd>
    </dl>
  </div>

  <section>
    <h2>Where the build is today</h2>
    <div class="timeline">
      <div class="done"><b>Sprints 1–2 ✓</b>Sign-up, search, in-person booking</div>
      <div class="now"><b>Sprint 3 · now</b>Video booking, SMS reminders</div>
      <div><b>Sprint 4</b>Intake form, schedule view</div>
      <div><b>Sprint 5</b>Epic sync, insurance check</div>
      <div><b>Sprint 6</b>Pilot testing</div>
      <div><b>Apr 27</b>Pilot goes live</div>
    </div>
  </section>

  <div class="note warn"><span>⚠</span><span><b>The open risk:</b> the team asked Lakeside IT (Sam Porter) for Epic test access on Feb 24. It still hasn't arrived. If it's late, the Epic sync and the pilot date move. You'll hear about this a lot.</span></div>

  <section>
    <h2>The people</h2>
    <div class="people">
      <div class="card person"><div class="av">DB</div><div><b>Dana Brooks<span class="tag">You meet her today</span></b><span>VP of Product, Brightpath. Decides scope and dates. Cares about the pilot date and patient experience.</span></div></div>
      <div class="card person"><div class="av">KW</div><div><b>Kevin Walsh</b><span>CTO, Brightpath. Owns architecture and security. Cares about stability and cloud cost.</span></div></div>
      <div class="card person"><div class="av">AM</div><div><b>Dr. Alan Mercer</b><span>Chief Medical Information Officer, Lakeside. Cares about doctors' workflow and patient safety.</span></div></div>
      <div class="card person"><div class="av">LC</div><div><b>Lisa Chen</b><span>Clinic Operations Manager, Lakeside. Cares about front-desk time and no-shows.</span></div></div>
      <div class="card person"><div class="av">SP</div><div><b>Sam Porter</b><span>Epic analyst, Lakeside IT. Controls Epic access and security approvals.</span></div></div>
      <div class="card person"><div class="av you">You</div><div><b>You</b><span>Lead engineer and, from today, the client's main technical contact. Team: a tech lead, a mobile engineer, a QA engineer.</span></div></div>
    </div>
  </section>

<template id="t1">
  <div><div class="kicker">Day 1 · Lesson 2 of 6 · 10 min</div><h1>What clients judge you on</h1></div>
  <p class="lead">Before you meet Dana, know what she'll be listening for. Clients don't score your code on a call. They quietly ask themselves four questions about you. These are the four pillars of a client-ready engineer.</p>
  <div class="pillars">
    <div class="pill p-und"><b>Understand</b><p class="q">“Do they get what I actually need?”</p></div>
    <div class="pill p-com"><b>Communicate</b><p class="q">“Can I follow them easily?”</p></div>
    <div class="pill p-own"><b>Own</b><p class="q">“Can I rely on them?”</p></div>
    <div class="pill p-sf"><b>Stand firm</b><p class="q">“Will they tell me the truth?”</p></div>
  </div>
  <p class="body">Each pillar is made of a few behaviours you can actually hear on a call: 14 in total. You don't need to learn them today. Open a few to hear the difference, and you'll practise each one later in the course.</p>
  <div id="behaviours" style="display:flex;flex-direction:column;gap:24px"></div>
</template>

<template id="t2">
  <div><div class="kicker">Day 1 · Lesson 3 of 6 · Mock call · 15 min</div><h1>Your first call with Dana</h1></div>
  <p class="lead">Dana has blocked 15 minutes to meet her new main contact. Her old vendor only sent news when she asked, and she's heard EHR integrations always run late. This is your baseline, so there's no script and no preparation: read the facts (2 minutes), then make the call.</p>

  <div class="call">
    <div class="card">
      <span class="label">What you know before the call</span>
      <dl class="kv" style="margin-top:6px">
        <dt>You</dt><dd>Lead engineer on CareBook v2 since January. You own the build, the weekly update and technical questions.</dd>
        <dt>Done so far</dt><dd>Sign-up and login, clinic and provider search, in-person booking. Working in staging.</dd>
        <dt>Next 8 weeks</dt><dd>Sprint 3: video booking, SMS reminders · Sprint 4: intake form, schedule view · Sprint 5: Epic sync, eligibility · Sprint 6: pilot testing.</dd>
        <dt>How you'll work</dt><dd>Your proposal: a sync every Friday at 10:00 am Central, a written update after it, and a same-day message if a risk appears.</dd>
        <dt>Open item</dt><dd style="color:var(--warning)">Epic sandbox access from Sam Porter, requested Feb 24. Still pending.</dd>
      </dl>
    </div>
    <div class="card dana">
      <div class="who"><div class="av">DB</div><div><b>Dana Brooks</b><div style="font-size:13px;color:var(--muted)">VP of Product, Brightpath · Level 1</div></div></div>
      <p style="font-size:14px;color:var(--fg2)">Fast, busy and outcome-driven. Friendly, but testing whether you can be trusted.</p>
      <div class="note info" style="flex-direction:column;gap:2px"><b>Your goal</b><span>Open the call yourself, introduce yourself and the plan in under 2 minutes, agree how you'll keep her updated, and close with next steps.</span></div>
      <span class="label">She may ask</span>
      <div class="bubble">“So you're my person now. What happened to your delivery manager?”</div>
      <div class="bubble">“What's your background with healthcare projects?”</div>
      <div class="bubble">“What will you do differently from the last team?”</div>
    </div>
  </div>

  <div class="card">
    <h2>Make the call</h2>
    <div class="runbar">
      <ol class="steps">
        <li>Copy the prompt. It tells the AI to play Dana.</li>
        <li>Paste it as text into Claude, ChatGPT or Gemini, then switch to voice mode.</li>
        <li>Speak first. When you're done, say “End the call. Give me feedback.”</li>

/* ---------- player ---------- */
const done=new Set();let D=0,L=0;
function outline(){
  $('#days').innerHTML=DAYS.map((d,di)=>{
    const n=d.lessons.filter((_,i)=>done.has(di+'-'+i)).length;
    const open=di===D;
    if(d.assess) return `<button class="ol-day ol-assess${open?' open':''}" type="button" data-d="${di}"><span class="chev">◆</span>${d.title}<span class="sub">${open?'':'10 q'}</span></button>`;
    return `<button class="ol-day${open?' open':''}" type="button" data-d="${di}"><span class="chev">${open?'▾':'▸'}</span><span class="dn">Day ${d.n}</span>${d.title}<span class="sub num">${n}/${d.lessons.length}</span></button>`+
      (open?`<ul class="lessons">${d.lessons.map((l,i)=>{const k=di+'-'+i;return `<li><button type="button" data-l="${i}" aria-current="${i===L}"><span class="st ${done.has(k)?'done':i===L?'cur':''}">${done.has(k)?'✓':''}</span><span>${l[0]}<span class="meta">${l[1]}</span></span></button></li>`}).join('')}</ul>`:'');
  }).join('');
  document.querySelectorAll('#days .ol-day').forEach(b=>b.onclick=()=>go(+b.dataset.d,0));
  document.querySelectorAll('#days .lessons button').forEach(b=>b.onclick=()=>go(D,+b.dataset.l));
}
const P=[
 ['p-und','Understand',[['U1','Decode an unclear requirement','“Before I suggest anything, can I ask a few questions? Who will use this, and what problem are they facing today?”','Jumping straight to a solution or an estimate.'],['U2','Play back what you understood','“So what I\'m hearing is X, Y and Z. Did I get that right?”','Saying “okay, got it” and assuming.'],['U3','Link your work to business outcomes','“Caching the insurance lookup cuts check-in from 6 seconds to under 1. Your front desk checks in about 200 patients a day.”','Only technical talk about frameworks, tables and APIs.'],['U4','Use AI to prepare, summarise and think','You arrive with a one-page prep and send a recap within 2 hours, AI-assisted and checked by you.','Walking in cold, sending raw AI text, putting patient data into AI tools.']]],
 ['p-com','Communicate',[['C1','Speak in a clear structure','“Short answer: yes, by Friday. Two things make that possible…”','A long background story before the point.'],['C2','Write clearly','The subject line states the ask. The bottom line is in the first two lines. Bullets. One screen.','Walls of text, a buried ask, “Please do the needful.”'],['C3','Explain trade-offs simply','“Option A takes 2 days but is harder to change later. Option B takes 5 days but scales. I recommend B because you\'re adding three clinics next quarter.”','Options with no recommendation, or jargon.'],['C4','Give a short status update','Done, next, blocked, risk, in under 60 seconds.','Listing every task you touched.']]],
 ['p-own','Own',[['O1','Surface risks early','“Heads-up: the EHR sandbox access isn\'t here yet. If it isn\'t ready by Wednesday, the demo moves. I\'ve already chased your IT team.”','Staying silent and hoping it resolves itself.'],['O2','Deliver bad news without hiding','Headline first, then impact, options, what you need from them, and when you\'ll update next.','Hiding it in a long email, over-apologising, blaming.'],['O3','Own the follow-up','“I\'ll send the summary by 5 pm your time and confirm the API details by Thursday.” And then you do it.','“Someone will check.” Waiting to be reminded.'],['O4','Speak as an owner','“My recommendation is…” “Here\'s what I suggest we do next.” “I\'ll handle…”','“Should I…?”, “Whatever you say”, waiting for instructions.']]],
 ['p-sf','Stand firm',[['S1','Say “I don\'t know, I\'ll check”','“Good question. I don\'t have that number with me. I\'ll confirm by tomorrow noon your time.”','Guessing, freezing, long apologies.'],['S2','Disagree professionally','“I see why you want to skip testing to hit Friday. My concern is wrong appointment times reaching patients. Could we ship the core flow Friday and the rest on Tuesday?”','Silent agreement then a missed date, or arguing personally.']]]
];
const score={};P.forEach(p=>p[2].forEach((b,i)=>score[b[0]]=[2,3,2,3][i%4]));
function behaviours(){
  $('#behaviours').innerHTML=P.map(p=>`<div class="pgroup ${p[0]}"><h3><i></i>${p[1]}</h3>${p[2].map((b,i)=>`<details class="beh"${i===0&&p[1]==='Understand'?' open':''}><summary><span class="code">${b[0]}</span>${b[1]}</summary><div class="two"><div class="say good"><span class="label">✓ Sounds like</span>${b[2]}</div><div class="say bad"><span class="label">✕ Watch out for</span>${b[3]}</div></div></details>`).join('')}</div>`).join('');
}
function rates(){
  $('#avgs').innerHTML=P.map(p=>{const a=p[2].reduce((s,b)=>s+score[b[0]],0)/p[2].length;return `<div class="avg ${p[0]}"><span>${p[1]}</span><b class="num">${a.toFixed(1)} / 5</b></div>`}).join('');
  $('#rates').innerHTML=P.map(p=>`<div class="card ${p[0]}"><h2 style="display:flex;gap:8px;align-items:center"><i style="width:10px;height:10px;border-radius:50%;background:var(--pc)"></i>${p[1]}</h2>${p[2].map(b=>`<div class="rate"><span>${b[1]}</span><div class="seg" role="group" aria-label="${b[1]}">${[1,2,3,4,5].map(n=>`<button type="button" aria-pressed="${score[b[0]]===n}" data-k="${b[0]}" data-n="${n}">${n}</button>`).join('')}</div></div>`).join('')}</div>`).join('');
  document.querySelectorAll('#rates .seg button').forEach(x=>x.onclick=()=>{score[x.dataset.k]=+x.dataset.n;rates();});
}
function go(d,l){
  D=d;L=l;const day=DAYS[d],les=day.lessons[l];
  $('#lesson').innerHTML=les[2]();
  if(d===0&&l===1)behaviours();
  if(d===0&&l===4)rates();
  document.querySelectorAll('.copy').forEach(c=>c.onclick=async()=>{const t=c.textContent;try{await navigator.clipboard.writeText('(prompt text)');c.textContent='Copied ✓'}catch{c.textContent='Copy failed'}setTimeout(()=>c.textContent=t,1500)});
  document.querySelectorAll('#lesson .seg:not([aria-label^="U"]) button').forEach(x=>{if(!x.dataset.k)x.onclick=()=>{x.parentElement.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===x));}});
  const first=d===0&&l===0,lastL=l===day.lessons.length-1,lastAll=lastL&&d===DAYS.length-1;
  $('#prev').style.visibility=first?'hidden':'visible';
  const nextDay=DAYS[d+1];
  $('#next').textContent=day.assess?['Start the assessment →','Submit answer →','Start Day 6 →'][l]:lastL&&nextDay&&nextDay.assess?'Next: Week 1 assessment →':lastL?`Finish Day ${day.n} → Day ${nextDay.n}`:`Next: ${day.lessons[l+1][0]} →`;
  $('#pos').textContent=day.assess?'Week 1 · Assessment':`Day ${day.n} · ${day.date} · Lesson ${l+1} of ${day.lessons.length}`;
  const dn=day.assess?5:day.n;
  document.querySelector('.prog .num').textContent=`Day ${dn} of 65`;
  document.querySelector('.prog .t i').style.width=(dn/65*100)+'%';
  outline();$('#main').scrollTop=0;
}
$('#next').onclick=()=>{done.add(D+'-'+L);const day=DAYS[D];if(L<day.lessons.length-1)go(D,L+1);else if(D<DAYS.length-1)go(D+1,0);else outline();};
$('#prev').onclick=()=>{if(L>0)go(D,L-1);else if(D>0)go(D-1,DAYS[D-1].lessons.length-1);};
go(0,0);
</script>
