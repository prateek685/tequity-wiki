<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Client-Ready Portal Final Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: enterprise workspace — fixed sidebar, sticky top bar, one content column (max 1168px); bento dashboard on Home. Phone: top bar + bottom tabs.
   Tokens only: every colour, size and radius below comes from :root. No component uses a literal value. */
:root{
  /* neutrals (slate, warm-biased to sit with orange) */
  --bg:#f7f7f6; --surface:#ffffff; --subtle:#f2f2f0; --line:#e5e4e1; --line-2:#d6d4d0;
  --fg:#1c1b19; --fg-2:#3d3a36; --muted:#6e6a64; --faint:#a29e97;
  /* accent: orange */
  --acc-50:#fff4ec; --acc-100:#ffe4cf; --acc-500:#c2410c; --acc-600:#a3370a; --acc-700:#9a3412; --acc-fg:#ffffff;
  /* status */
  --ok:#2f7a4f; --ok-soft:#e8f3ec; --warn:#8a5a12; --warn-soft:#f7efdf; --bad:#b42318; --bad-soft:#fdeceb; --info:#3f5f8f; --info-soft:#ebf0f7;
  /* pillar tints (charts only) */
  --p-und:#5b7fa6; --p-com:#8a6fb0; --p-own:#4f8a86; --p-sf:#b0605a;
  /* type */
  --f-sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --t-xs:12px; --t-sm:13px; --t-base:14px; --t-md:16px; --t-lg:18px; --t-xl:22px; --t-2xl:28px;
  --lh-xs:16px; --lh-sm:20px; --lh-base:22px; --lh-md:26px; --lh-xl:30px; --lh-2xl:36px;
  /* space, radius, elevation */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-ctl:6px; --r-card:10px;
  --shadow:0 1px 2px rgba(28,27,25,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f0e; --surface:#181715; --subtle:#201e1c; --line:#2c2a27; --line-2:#3a3733;
  --fg:#efede9; --fg-2:#d3cfc8; --muted:#a39e96; --faint:#6f6a63;
  --acc-50:#2a1609; --acc-100:#3d1f0b; --acc-500:#fb8a4c; --acc-600:#fda06d; --acc-700:#fdb48c; --acc-fg:#1d0d03;
  --ok:#74c497; --ok-soft:#13261b; --warn:#ddb06a; --warn-soft:#2a2111; --bad:#f2827a; --bad-soft:#2e1514; --info:#93acd6; --info-soft:#18202e;
  --p-und:#86a6cb; --p-com:#b39ad6; --p-own:#7fb6b1; --p-sf:#d68c86;
  --shadow:0 1px 2px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#100f0e; --surface:#181715; --subtle:#201e1c; --line:#2c2a27; --line-2:#3a3733;
  --fg:#efede9; --fg-2:#d3cfc8; --muted:#a39e96; --faint:#6f6a63;
  --acc-50:#2a1609; --acc-100:#3d1f0b; --acc-500:#fb8a4c; --acc-600:#fda06d; --acc-700:#fdb48c; --acc-fg:#1d0d03;
  --ok:#74c497; --ok-soft:#13261b; --warn:#ddb06a; --warn-soft:#2a2111; --bad:#f2827a; --bad-soft:#2e1514; --info:#93acd6; --info-soft:#18202e;
  --p-und:#86a6cb; --p-com:#b39ad6; --p-own:#7fb6b1; --p-sf:#d68c86;
  --shadow:0 1px 2px rgba(0,0,0,.45); color-scheme:dark }

/* base */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--fg); font:400 var(--t-base)/var(--lh-base) var(--f-sans); -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
h1{font-size:var(--t-xl); line-height:var(--lh-xl)}
h2{font-size:var(--t-md); line-height:var(--lh-md)}
h3{font-size:var(--t-base); line-height:var(--lh-base)}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--acc-700)}
:focus-visible{outline:2px solid var(--acc-500); outline-offset:2px}

/* utilities (the only "helpers"; reused everywhere) */
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:var(--t-sm)}
.muted{color:var(--muted)} .t-sm{font-size:var(--t-sm); line-height:var(--lh-sm)} .t-xs{font-size:var(--t-xs); line-height:var(--lh-xs)}
.t-right{text-align:right} .fw-500{font-weight:500} .t-bad{color:var(--bad)} .t-ok{color:var(--ok)} .t-warn{color:var(--warn)}
.label{font-size:var(--t-xs); line-height:var(--lh-xs); font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.stack{display:flex; flex-direction:column; gap:var(--s4); min-width:0}
.stack-sm{display:flex; flex-direction:column; gap:var(--s2); min-width:0}
.row{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center}
.row.nowrap{flex-wrap:nowrap}
.end{justify-content:flex-end} .between{justify-content:space-between}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.w-auto{width:auto}
.max-field{max-width:320px}
.clickable{cursor:pointer}
.block{display:block}
.divider{border-top:1px solid var(--line)}

/* shell */
.shell{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
.side{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:var(--s3) var(--s2)}
.ws{display:flex; align-items:center; gap:var(--s3); padding:var(--s1) var(--s2) var(--s3); border-bottom:1px solid var(--line); margin-bottom:var(--s2)}
.logo{width:28px; height:28px; border-radius:var(--r-ctl); background:var(--acc-500); color:var(--acc-fg); display:grid; place-items:center; font-weight:600; font-size:var(--t-xs); flex:none}
.ws b{display:block; font-size:var(--t-sm); font-weight:600} .ws span{font-size:var(--t-xs); color:var(--muted)}
.nav{display:flex; align-items:center; gap:var(--s3); width:100%; padding:7px var(--s3); border:0; background:none; border-radius:var(--r-ctl); color:var(--fg-2); cursor:pointer; text-align:left; font-weight:500}
.nav svg{color:var(--muted); flex:none}
.nav:hover{background:var(--subtle)}
.nav[aria-current="page"]{background:var(--acc-50); color:var(--acc-700)}
.nav[aria-current="page"] svg{color:var(--acc-500)}
.nav .count{margin-left:auto; font:500 var(--t-xs) var(--f-mono); color:var(--muted)}
.navsec{font-size:var(--t-xs); font-weight:500; color:var(--faint); padding:var(--s3) var(--s3) var(--s1); text-transform:uppercase; letter-spacing:.05em}
.side .foot{margin-top:auto; border-top:1px solid var(--line); padding:var(--s3) var(--s2) 0; display:flex; gap:var(--s3); align-items:center}
.av{width:30px; height:30px; border-radius:50%; background:var(--subtle); border:1px solid var(--line-2); display:grid; place-items:center; font-size:var(--t-xs); font-weight:600; color:var(--fg-2); flex:none}
.foot b{display:block; font-size:var(--t-sm); font-weight:600} .foot span{font-size:var(--t-xs); color:var(--muted)}
.main{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; height:52px; display:flex; align-items:center; gap:var(--s3); padding-inline:var(--s6); background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)}
.crumb{display:flex; gap:var(--s2); align-items:center; font-size:var(--t-sm); color:var(--muted); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumb b{color:var(--fg); font-weight:500}
.spacer{flex:1}
.demo{display:flex; align-items:center; gap:var(--s2); font-size:var(--t-xs); color:var(--muted)}
.demo .tag{border:1px dashed var(--line-2); border-radius:4px; padding:2px 6px; color:var(--warn)}
.iconbtn{width:32px; height:32px; border-radius:var(--r-ctl); border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--fg-2)}
.content{padding:var(--s6); max-width:1168px; width:100%; display:flex; flex-direction:column; gap:var(--s5)}
.mbrand{display:none; align-items:center; gap:var(--s2); font-weight:600; white-space:nowrap}
.mbrand .logo{width:24px; height:24px}
.tabs-m{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding-inline:var(--s4)}
  .crumb{display:none} .mbrand{display:flex}
  .demo .tag{display:none}
  .content{padding:var(--s4); padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs-m{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding:6px var(--s1) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs-m button{flex:1; min-width:0; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-size:11px; font-weight:500; color:var(--muted); cursor:pointer}
  .tabs-m button[aria-current="page"]{color:var(--acc-500)}
}

/* page header */
.ph{display:flex; flex-wrap:wrap; gap:var(--s3) var(--s4); align-items:flex-end; justify-content:space-between}
.ph .t{display:flex; flex-direction:column; gap:var(--s1); min-width:0}
.ph p{color:var(--muted); font-size:var(--t-sm); line-height:var(--lh-sm)}
.greet{font-size:var(--t-2xl); line-height:var(--lh-2xl); font-weight:600; letter-spacing:-.02em}

/* components */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--shadow); min-width:0}
.card.clip{overflow:hidden}
.card > .hd{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center; justify-content:space-between; padding:var(--s3) var(--s4); border-bottom:1px solid var(--line)}
.card > .bd{padding:var(--s4); display:flex; flex-direction:column; gap:var(--s4)}
.card > .bd.tight{gap:var(--s3)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 var(--s3); border-radius:var(--r-ctl); border:1px solid var(--line-2); background:var(--surface); font-weight:500; font-size:var(--t-sm); cursor:pointer; white-space:nowrap; color:var(--fg)}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--acc-500); border-color:var(--acc-500); color:var(--acc-fg)}
.btn.pri:hover{background:var(--acc-600); border-color:var(--acc-600)}
.btn.ghost{border-color:transparent; background:none; color:var(--fg-2)}
.btn.sm{height:28px; padding:0 10px; font-size:var(--t-xs)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.pill{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 var(--s2); border-radius:11px; font-size:var(--t-xs); font-weight:500; background:var(--subtle); color:var(--fg-2); white-space:nowrap; border:1px solid var(--line)}
.pill.dot::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.pill.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.pill.info{background:var(--info-soft); color:var(--info); border-color:transparent}
.pill.acc{background:var(--acc-50); color:var(--acc-700); border-color:transparent}
.bar{height:6px; background:var(--subtle); border-radius:3px; overflow:hidden}
.bar > span{display:block; height:100%; width:var(--v,0%); background:var(--acc-500); border-radius:3px}
.bar.und > span{background:var(--p-und)} .bar.com > span{background:var(--p-com)} .bar.own > span{background:var(--p-own)} .bar.sf > span{background:var(--p-sf)}
input[type=text],input[type=date],select,textarea{width:100%; border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r-ctl); padding:var(--s2) 10px; font-size:var(--t-base)}
select.w-auto{width:auto; padding:5px var(--s2); font-size:var(--t-sm)}
textarea{min-height:120px; resize:vertical; line-height:var(--lh-base)}
textarea.short{min-height:72px}
.field{display:flex; flex-direction:column; gap:6px}
.field > span{font-size:var(--t-sm); font-weight:500; color:var(--fg-2)}
.note{display:flex; gap:var(--s2); align-items:flex-start; padding:9px var(--s3); border-radius:var(--r-ctl); background:var(--subtle); font-size:var(--t-sm); line-height:var(--lh-sm); color:var(--muted); border:1px solid var(--line)}
.note.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.note.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.note.info{background:var(--info-soft); color:var(--info); border-color:transparent}
.note svg{flex:none; margin-top:2px}
.check{display:flex; gap:var(--s2); align-items:center; font-size:var(--t-sm); padding:3px 0}

/* grids */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:var(--s3)}
.kpi{padding:var(--s3) var(--s4); display:flex; flex-direction:column; gap:var(--s1)}
.kpi b{font-size:var(--t-xl); line-height:var(--lh-xl); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kpi b small{font-size:var(--t-base); font-weight:400; color:var(--muted); letter-spacing:0}
.kpi .s{font-size:var(--t-xs); color:var(--muted)}
.bento{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--s4)}
.c-8{grid-column:span 8} .c-4{grid-column:span 4} .c-6{grid-column:span 6} .c-12{grid-column:span 12}
.grid-2{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:var(--s4)}
.grid-h{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s4)}
.rubric-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:2px var(--s8)}
@media (max-width:1100px){ .c-4.half{grid-column:span 6} }
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento,.grid-2,.grid-h{grid-template-columns:minmax(0,1fr)}
  .c-8,.c-4,.c-6,.c-12,.c-4.half{grid-column:auto}
}

/* dashboard pieces */
.ring{position:relative; width:148px; height:148px; margin:0 auto}
.ring svg{display:block}
.ring .c{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
.ring .c b{display:block; font:600 var(--t-2xl)/1 var(--f-sans); font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:130px minmax(0,1fr); gap:var(--s2) var(--s4); font-size:var(--t-sm); line-height:var(--lh-sm)}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.kv.tight{grid-template-columns:minmax(0,1fr) auto}
.kv.tight dd{text-align:right}
@media (max-width:560px){ .kv:not(.tight){grid-template-columns:minmax(0,1fr); gap:2px} .kv:not(.tight) dd{margin-bottom:var(--s2)} }
.strip{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
.strip span{display:flex; flex-direction:column; align-items:center; gap:4px; padding:var(--s2) 0; border:1px solid var(--line); border-radius:var(--r-ctl); font-size:var(--t-xs); color:var(--muted)}
.strip span b{font:500 var(--t-base) var(--f-mono); color:var(--fg)}
.strip span.done{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.strip span.done b{color:var(--ok)}
.strip span.today{background:var(--acc-500); border-color:var(--acc-500); color:var(--acc-fg)}
.strip span.today b{color:var(--acc-fg)}
.pb{display:grid; grid-template-columns:110px minmax(0,1fr) 28px; gap:var(--s3); align-items:center; font-size:var(--t-sm)}
.upnext{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s3)}
.upnext article{border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s4); display:flex; flex-direction:column; gap:var(--s2)}
.upnext article p{color:var(--muted); font-size:var(--t-sm); line-height:var(--lh-sm)}
.upnext article .btn{align-self:flex-start; margin-top:auto}
@media (max-width:900px){ .upnext{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:minmax(240px,80%); overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:var(--s1)} .upnext article{scroll-snap-align:start} }

/* table → stacked rows on phones */
.tbl{width:100%; border-collapse:collapse; font-size:var(--t-sm)}
.tbl th{text-align:left; font-size:var(--t-xs); font-weight:500; color:var(--muted); padding:var(--s2) var(--s4); border-bottom:1px solid var(--line); background:var(--subtle); white-space:nowrap}
.tbl td{padding:10px var(--s4); border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:var(--subtle)}
.tbl .r{text-align:right}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl, .tbl tbody, .tbl tr, .tbl td{display:block; width:100%}
  .tbl tr{padding:var(--s3) var(--s4); border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{padding:3px 0; border:0; display:flex; justify-content:space-between; gap:var(--s3); text-align:right}
  .tbl td::before{content:attr(data-l); color:var(--muted); font-size:var(--t-xs); text-align:left; flex:none}
  .tbl td.lead{display:block; text-align:left; font-weight:500; padding-bottom:6px}
  .tbl td.lead::before{display:none}
}

/* lists */
.list{display:flex; flex-direction:column}
.li{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:var(--s3); align-items:center; padding:11px var(--s4); border-bottom:1px solid var(--line)}
.li.no-icon{grid-template-columns:minmax(0,1fr) auto}
.li:last-child{border-bottom:0}
.bd > .list .li{padding-inline:0}
.li b{font-weight:500; display:block} .li small{display:block; font-size:var(--t-xs); line-height:var(--lh-xs); color:var(--muted); margin-top:2px}
.chk{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line-2); display:grid; place-items:center; color:#fff}
.chk.on{background:var(--ok); border-color:var(--ok)}
.chk.next{border-color:var(--acc-500)}
.chk.lock{border-style:dashed}

/* day page */
.daygrid{display:grid; grid-template-columns:260px minmax(0,1fr); gap:var(--s4); align-items:start}
.steps{display:flex; flex-direction:column}
.step{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:11px 14px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer; width:100%}
.step:last-child{border-bottom:0}
.step:hover:not(:disabled){background:var(--subtle)}
.step[aria-current="step"]{background:var(--acc-50); box-shadow:inset 3px 0 0 var(--acc-500)}
.step:disabled{cursor:not-allowed; opacity:.65}
.step b{display:block; font-weight:500; font-size:var(--t-sm)} .step small{font-size:var(--t-xs); color:var(--muted)}
.step .k{font:500 11px var(--f-mono); color:var(--muted)}
@media (max-width:900px){
  .daygrid{grid-template-columns:minmax(0,1fr)}
  .steps{flex-direction:row; overflow-x:auto; scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .step{flex:none; width:auto; border-bottom:0; border-right:1px solid var(--line); grid-template-columns:18px auto; padding:10px var(--s3)}
  .step small,.step .k{display:none}
  .step[aria-current="step"]{box-shadow:inset 0 -2px 0 var(--acc-500)}
}
.prose{font-size:var(--t-md); line-height:var(--lh-md); max-width:68ch; color:var(--fg-2)}
.quote{border-left:2px solid var(--acc-500); padding:var(--s1) 0 var(--s1) 14px; font-size:var(--t-md); line-height:var(--lh-md); color:var(--fg)}
.quote.muted{color:var(--muted)}
.framework{font-size:var(--t-lg); line-height:var(--lh-md)}

.opt .k{font:500 var(--t-xs) var(--f-mono); color:var(--muted); padding-top:2px}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}

@media (max-width:900px){ .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))} }
.tabsbar{display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 var(--s3)}
.tabsbar button{border:0; background:none; padding:10px; font-weight:500; color:var(--muted); cursor:pointer}
.tabsbar button[aria-selected="true"]{color:var(--fg); box-shadow:inset 0 -2px 0 var(--acc-500)}

<script>
/* ---------- data ---------- */
const P={home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',today:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',plan:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',book:'<path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',flag:'<path d="M5 21V4h11l-1.5 4L16 12H5"/>',doc:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h4"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',cards:'<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 7V4h14v13h-4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',check:'<path d="m5 12 5 5 9-10"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};

"A quick change during a call","Daily status: “Why is this taking so long?”","Pyramid principle: explain a bug","Plain US business English","Weekly sync at Level 2",
"Open questions: the dashboard request","5 Whys: find the real goal","Playback in 3 bullets","Discovery checklist","Discovery call: new-patient intake",
"Owner language","AI before the call","AI after the call","“I don’t know, I’ll check”","Gate 1 dress rehearsal",
"US healthcare in one picture","HIPAA for engineers","Discovery call structure","User stories and acceptance criteria","Discovery: EHR data for doctors",
"Stakeholder map","Estimates as ranges","The trade-off formula","EHR and FHIR in plain terms","Scope change and change note",
"Disagree professionally","The bad-news formula","Handling an upset client","Saying no","Bad news with pushback",
"Escalation","Async end-of-day updates","Weekly status (RAG)","Billing and revenue cycle","Gate 2 dress rehearsal",
"The technical story (CPARB)","Three levels, two audiences","Live call: shadow #1","Analogies: explain FHIR","Live call: shadow #2",
"Demo structure","When the demo breaks","Live call: co-lead one agenda item","Demo rehearsal","Live demo segment",
"Product questions","Propose an improvement","Live call: co-lead requirements","Handle a sceptical VP","Live call: co-lead #2",
"Plan the call you’ll lead","Dress rehearsal","Live call: lead #1","Practise one thing","Live call: lead #2",
"Day-1 call, again","Live call: solo","Weakest-pillar drill","My readiness case","Final review"];
const LIVE=[43,45,48,50,53,55,58,60,62];
const PHASES=[[1,20,"Phase 1 · Foundation"],[21,40,"Phase 2 · Client craft"],[41,65,"Phase 3 · Live reps"]];
const QUIZ=[
 {k:"Concept",q:"What goes in your first sentence when you use BLUF?",o:[["The background, so the client has context",0,"That is the habit BLUF replaces."],["The answer, then the reason",1,"“Short answer: yes, Friday works. Here’s why…”"],["An apology for the delay",0,"Over-apologising is a watch-out in the readiness model."],["The agenda for the call",0,"The agenda belongs in the call opener."]]},
 {k:"Concept",q:"Today’s target for a status answer is under…",o:[["15 seconds",0,"Too short for an answer and a reason."],["45 seconds",1,"Goal for this block: answer any status question answer-first in under 45 seconds."],["2 minutes",0,"That is the target for a full weekly status later in the plan."],["5 minutes",0,"Far too long for one answer."]]},
 {k:"Concept",q:"Video booking is about 60% done. Dana asks: “Is it done?” Which opening is BLUF?",o:[["“So we started with the screens, then the video link…”",0,"History first. Dana still has no answer."],["“Not yet. It’s about 60%, and you’ll see it at the demo on the 13th.”",1,"Answer, status and the next date in one breath."],["“It depends on a few things.”",0,"No answer and no date."],["“I’ll check with the team.”",0,"You know this. Keep “I’ll check” for real unknowns."]]},
 {k:"From today’s mock (S02)",c:"Dana: “Quick one. Are we still on track for April 27?”",q:"Pick the best reply.",o:[["“We had some challenges with the Twilio config and…”",0,"Background and jargon first."],["“Short answer: yes. One risk: Epic access. If it’s not here by March 16, the date is at risk.”",1,"Answer first, then the one real risk with its date and impact."],["“Mostly yes, depending on a few things.”",0,"Dana can’t act on this."],["“We’re trying our best.”",0,"Sounds unsure and gives no facts."]]},
 {k:"Written",q:"Rewrite this message so the bottom line comes first.",m:"Sorry for the delay, sorry, the build was broken yesterday and QA was blocked, we will try to give the build by tomorrow EOD hopefully."}
];
const STEPS=[["prep","Prep","5 min","Write 3 status questions with one-line answers"],["learn","Learn","10 min","BLUF + the first 15 min of Matt Abrahams’ talk"],["mock","Mock call","10–15 min","Rapid-fire status questions with Dana (S02)"],["write","Write","10 min","Rewrite 3 messages BLUF-style"],["quiz","Daily quiz","5 questions","5 questions on today"]];
const FOUR=["prep","learn","mock","write"];

const S={role:"engineer",view:{engineer:"home",manager:"team",admin:"questions"},step:"prep",allDone:false,done:{prep:0,learn:0,mock:0,write:0,quiz:0},
 q:{i:0,pick:null,ok:0,ws:"idle",txt:""},ws:"idle",wsrc:"carebook",live:"live",fail:false,

   <div class="foot"><span class="av">${w[0]}</span><div><b>${w[1]}</b><span>${w[2]}</span></div></div>`;

      <div class="list">
        <div class="li no-icon"><div><b>Day 1 · Baseline call</b><small>Fix next time: I started with the background twice.</small></div><span class="mono">2.8</span></div>

    <section class="card"><div class="hd"><h2>AI score</h2></div><div class="bd">${fb(3,[["Owner language",1],["Gives a date",1],["Says what happens if it slips",0]],"Clear ownership and dates. The slip plan is vague.","“If access isn’t ready by Thursday noon, I’ll call you with two options.”")}</div></section>
  </div>
  <section class="card"><div class="hd"><h2>Your score</h2><span class="muted t-sm">Meera sees both scores and your note</span></div><div class="bd">${scale("ov",0,cur)}<label class="field"><span>Note to Meera</span><input type="text" id="ovn" placeholder="Why you changed the score"></label></div>
  <table class="tbl"><thead><tr><th>History</th><th>When</th></tr></thead><tbody><tr><td class="lead" data-l="Change">AI scored 3 (model v1, prompt v1.2)</td><td data-l="When" class="muted">27 Nov</td></tr>${S.ov.map(o=>`<tr><td class="lead" data-l="Change">${o.by}: ${o.from} → ${o.to}. “${esc(o.note)}”</td><td data-l="When" class="muted">${o.when}</td></tr>`).join("")}</tbody></table></section>
  ${actionbar("ov","Save score")}`;
}
function gate(){
  const g2=S.gateNo===2, v=Object.values(S.gate).filter(x=>x!=="na").map(Number), n=v.length;
  const avg=n?v.reduce((a,b)=>a+b,0)/n:0, low=n?Math.min(...v):0, pass=n>0&&avg>=(g2?3.0:2.5)&&low>=2;
  const outcome=n===0?pill("","Score at least one criterion"):pass?pill("ok dot","Meets the pass bar"):pill("bad dot","Below the pass bar");
  return `<div class="ph"><div class="t"><span class="label">${g2?"Neha Thomas · after Day 40":"Meera Kapoor · after Day 20"}</span><h1>Record Gate ${S.gateNo}</h1><p>${g2?"Pass: average ≥ 3.0, no criterion below 2, healthcare terms used correctly.":"Pass: average ≥ 2.5, no criterion at 1, recap within 2 hours."} Skip criteria that didn’t come up.</p></div>${scale("gno",0,S.gateNo,[1,2])}</div>
  <div class="grid-2">
    <section class="card"><div class="hd"><h2>Call rubric</h2><span class="muted t-sm">${g2?"25-min healthcare scenario":"20-min unseen Phase 1 scenario + surprise"}</span></div><div class="bd"><div class="rub">${RUBRIC.map((c,i)=>`<div class="r"><span>${i+1}. ${c}${i===10?' <span class="muted t-xs">(from the written follow-up)</span>':""}</span>${scale("g"+i,1,S.gate["g"+i])}</div>`).join("")}</div></div></section>
    <section class="card"><div class="hd"><h2>Result</h2></div><div class="bd">
      <dl class="kv tight"><dt>Scored</dt><dd class="mono">${n} of 11</dd><dt>Average</dt><dd class="mono">${n?avg.toFixed(2):"—"}</dd><dt>Lowest</dt><dd class="mono">${n?low:"—"}</dd></dl>
      ${g2?`<label class="check"><input type="checkbox" checked> Basic healthcare terms used correctly</label><label class="field"><span>Written follow-up</span><select><option>Recap + bad-news email</option><option>Recap + escalation message</option><option>Recap + weekly status report</option></select></label>`:`<label class="check"><input type="checkbox" checked> Recap received within 2 hours</label>`}
      <p>${outcome}</p>
      <label class="field"><span>Outcome</span><select id="gout">${pass||n===0?`<option>Pass</option><option>Pass with focus areas</option><option>Repeat 2 focus blocks</option>`:`<option>Repeat 2 focus blocks (suggested: Days 6–10, 11–15)</option><option>Pass (override, note required)</option>`}</select></label>
      <label class="field"><span>Green / Amber / Red and note</span><input type="text" placeholder="Amber: strong opener, froze on the surprise"></label>
      ${g2?`<label class="field"><span>Phase 3 live-call plan</span><input type="text" value="Shadow: Days 43, 45 · Co-lead: 48, 53, 55 · Lead: 58, 60"></label>`:""}
    </div></section>
  </div>${actionbar("gs","Save gate result")}`;
}
function flags(){
  return `<div class="ph"><div class="t"><h1>Red flags</h1><p>Checked every night. Pause days are excluded.</p></div></div>
  <section class="card"><table class="tbl"><thead><tr><th>Engineer</th><th>Signal</th><th>Suggested action</th><th>Since</th><th></th></tr></thead><tbody>
  ${[["Rohan Patel","No lesson completed for 14 days","1:1 this week. Protect a fixed 45-minute slot.","20 Nov"],["Rohan Patel","Stand firm at 2 or below on 3 scorecards","Pair with a strong client-facing engineer for two sessions.","18 Nov"],["Neha Thomas","2 live calls deferred in Phase 3","Start with a smaller live role. Join her first co-lead.","25 Nov"]].map(([a,b,c,d])=>`<tr><td class="lead" data-l="Engineer">${a}</td><td data-l="Signal">${b}</td><td data-l="Action" class="muted t-sm">${c}</td><td data-l="Since" class="mono">${d}</td><td class="r" data-l=""><button class="btn sm" data-act="ack">Acknowledge</button></td></tr>`).join("")}</tbody></table></section>`;
}

/* ---------- admin ---------- */
const DRAFTS=[["Multiple choice","Day 2","What goes in your first sentence when you use BLUF?","Day 2 framework box, PDF page 24","Say the answer first, then the reason. “Short answer: yes, Friday works. Here’s why…”"],["Client scenario","Day 2","Dana: “Are we still on track for April 27?” Pick the best reply.","Card S02 fact sheet, PDF page 28","Epic sandbox access… needed by Mon Mar 16 to keep the Sprint 5 EHR sync, and the Apr 27 pilot, on schedule."],["Written","Day 2","Rewrite messy message 5 so the bottom line comes first.","Section 7.5, message 5, PDF page 22","Sorry for the delay, sorry, the build was broken yesterday and QA was blocked…"]];
function questions(){
  const d=DRAFTS[S.qi], approved=62+S.qd.filter(x=>x==="ok").length;
  const head=`<div class="ph"><div class="t"><span class="label">Days 1–5 pools · ${approved} of 70 approved</span><h1>Question review</h1><p>AI drafts each question from the plan. Every draft quotes its source so nothing new is invented.</p></div></div>`;
  if(!d) return head+`<section class="card"><div class="bd"><p>Queue clear. ${approved} of 70 questions approved for Days 1–5.</p><div><button class="btn pri" data-act="pub">Publish pools</button></div></div></section>`;
  const body=d[0]==="Written"?`<dl class="kv"><dt>Model answer</dt><dd>QA gets the new build tomorrow by 5 pm Central.</dd><dt>Scoring points</dt><dd>New date first · one apology at most · firm time</dd><dt>Test answers</dt><dd>Weak 2 · OK 3 · Strong 5</dd></dl>`
    :`<div class="opts">${["The background","The answer, then the reason","An apology","The agenda"].map((o,k)=>`<div class="opt static ${k===1?"right":""}"><span class="k">${"ABCD"[k]}</span><span>${o}<small>${k===1?"Correct. Explanation shown after answering.":"Explanation shown after answering."}</small></span></div>`).join("")}</div>`;
  return head+`<div class="grid-h">
    <section class="card"><div class="hd"><h2>Draft ${S.qi+1} of ${DRAFTS.length}</h2><span class="row">${pill("",d[0])}${pill("",d[1])}</span></div><div class="bd"><p class="prose"><b>${d[2]}</b></p>${body}</div></section>
    <section class="card"><div class="hd"><h2>Source in the plan</h2></div><div class="bd"><p class="muted t-sm">${d[3]}</p><p class="quote">${d[4]}</p><p class="note ok">${ic("check",14)}<span>Source text found in the PDF. CareBook names only. No duplicate in the pool.</span></p></div></section>
  </div><div class="actionbar"><button class="btn" data-qv="no">Reject</button><div class="row"><button class="btn" data-act="soon">Edit</button><button class="btn pri" data-qv="ok">Approve</button></div></div>`;
}
function cards(){
  const t=S.tab;
  const panel=t==="public"?`<label class="field"><span>Story so far</span><textarea>It's Tuesday, March 3, your first week as the main contact for CareBook v2. Dana has 10 minutes between meetings.</textarea></label><label class="field"><span>Your goal</span><input type="text" value="Answer every question answer-first in 45 seconds or less, name the one real risk, end with a clear ask."></label>`
   :t==="private"?`<p class="note warn">${ic("lock",14)}<span>Admins only. Engineers get this through the logged copy button and never see it on screen.</span></p><label class="field"><span>Hidden facts</span><textarea>Your CEO has promised investors a live demo of video booking on May 12.
You have not yet sent the SMS wording to Lakeside's compliance team.
You know Sam Porter and could get Epic access moving, but only if asked directly.</textarea></label><label class="field"><span>Curveballs</span><textarea class="short">Ask: "Can we move the pilot a week earlier?"
Ask: "What will the AWS bill look like after launch?"</textarea></label>`
   :`<table class="tbl"><thead><tr><th>Day</th><th>Level</th><th>Story date</th><th class="r">Prompt copies</th></tr></thead><tbody><tr><td class="lead mono" data-l="Day">Day 2</td><td data-l="Level">Level 1</td><td data-l="Story date">Tuesday, March 3</td><td class="r mono" data-l="Copies">41</td></tr></tbody></table>`;
  return `<div class="ph"><div class="t"><span class="label">Mock card</span><h1>S02 · Rapid-fire status questions</h1><p>Used on Day 2 at Level 1.</p></div></div>
  <section class="card"><div class="tabsbar" role="tablist">${[["public","Public brief"],["private","Private part"],["uses","Uses"]].map(([k,l])=>`<button role="tab" aria-selected="${t===k}" data-tab="${k}">${l}</button>`).join("")}</div><div class="bd">${panel}<div class="row end"><button class="btn pri" data-act="saved">Save new version</button></div></div></section>`;
}
function users(){
  const rows=[["Content Admin","admin@company.com","Admin","—","Active"],["Ritik Mathur","ritik@company.com","Admin","—","Active"],["Priya Rao","priya@company.com","Manager","Platform","Active"],["Aarav Sharma","aarav@company.com","Engineer","Platform","Day 25"],["Sana Iqbal","sana@company.com","Pending","—","Waiting for access"]];
  return `<div class="ph"><div class="t"><h1>Users and roles</h1><p>Sign-in is Google only, company domain. New sign-ins wait as Pending until an admin assigns a role.</p></div><button class="btn" data-act="soon">Add team</button></div>
  <section class="card"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Team</th><th>Status</th></tr></thead><tbody>
  ${rows.map(([n,e,r,t,s])=>`<tr><td class="lead" data-l="Name">${n}</td><td data-l="Email" class="muted mono">${e}</td><td data-l="Role"><select class="w-auto" aria-label="Role for ${n}" data-role-of="${n}">${["Engineer","Manager","Admin","Pending"].map(o=>`<option ${o===r?"selected":""}>${o}</option>`).join("")}</select></td><td data-l="Team">${t}</td><td data-l="Status">${s==="Waiting for access"?pill("warn dot",s):pill("",s)}</td></tr>`).join("")}</tbody></table>
  <div class="bd divider"><p class="note">${ic("info",14)}<span>Several admins are allowed. The last active admin can’t be removed or demoted. Every role change is logged.</span></p></div></section>`;
}
function settings(){
  return `<div class="ph"><div class="t"><h1>Settings</h1></div></div>
  <section class="card"><table class="tbl"><thead><tr><th>Setting</th><th>Value</th></tr></thead><tbody>
  ${[["Assessment pass mark (multiple choice only)","60%"],["Retake wait","1 day"],["Plan length target","90 days"],["Behind-pace note after","3 days"],["Live-call deferrals before a red flag","2 in Phase 3"],["Gate 1 pass","Average ≥ 2.5, none at 1, recap in 2 h"],["Gate 2 pass","Average ≥ 3.0, none below 2, healthcare terms"],["Final review","≥ 3.5 and none below 3 / ≥ 3.0 / below 3.0"]].map(([a,b])=>`<tr><td class="lead" data-l="Setting">${a}</td><td data-l="Value"><input class="max-field" type="text" value="${b}" aria-label="${a}"></td></tr>`).join("")}</tbody></table>
  <div class="bd divider"><div class="row end"><button class="btn pri" data-act="saved">Save settings</button></div></div></section>`;
}

/* ---------- render + events ---------- */
const V={engineer:{home,day,plan,assessment,live,progress,journal,library},manager:{team,review,gate,flags},admin:{questions,cards,users,settings}};
function render(keep){
  const y=window.scrollY, v=S.view[S.role];
  $("#side").innerHTML=side(); $("#tabs").innerHTML=tabs();
  $("#crumb").innerHTML=`<span>${AREA[S.role]}</span><span>/</span><b>${CRUMB[v]}</b>`;
  $("#main").innerHTML=V[S.role][v](); $("#role").value=S.role;
  window.scrollTo({top:keep?y:0});
}
const go=v=>{S.view[S.role]=v; render();};
const onDay=k=>S.role==="engineer"&&S.view.engineer==="day"&&S.step===k;

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-nav],tr[data-act]"); if(!b) return; const d=b.dataset;
  if(d.nav){go(d.nav); return;}
  if(d.step){S.step=d.step; S.allDone=false; render(); return;}
  if(d.tab){S.tab=d.tab; render(true); return;}
  if(d.unlock){S.unlock=d.unlock; render(true); setTimeout(()=>$("#ur")?.focus(),0); return;}
  if(d.qv){S.qd[S.qi]=d.qv; S.qi++; render(); toast(d.qv==="ok"?"Approved.":"Rejected and sent back for rework."); return;}
  if(d.pick!==undefined){S.q.pick=+d.pick; if(QUIZ[S.q.i].o[+d.pick][1]) S.q.ok++; render(true); return;}
  const keep=()=>render(true);
  switch(d.act){
    case "prep": S.done.prep=1; S.step=nextOpenStep(); render(); toast("Prep saved to your private journal."); break;
    case "learn": S.done.learn=1; S.step=nextOpenStep(); render(); break;
    case "mock": S.done.mock=1; S.step=nextOpenStep(); render(); toast("Call logged."); break;
    case "write": S.done.write=1; S.ws="scoring"; keep(); setTimeout(()=>{S.ws="scored"; if(onDay("write")) keep();},1300); break;
    case "toNext": S.step=nextOpenStep(); render(); break;
    case "qw": S.q.txt=$("#qw").value; S.q.ws="scoring"; keep(); setTimeout(()=>{S.q.ws="scored"; if(onDay("quiz")) keep();},1200); break;
    case "qNext": S.q.i++; S.q.pick=null; render(); break;
    case "finish": S.done.quiz=1; S.allDone=true; render(); break;
    case "review": S.allDone=false; S.step="prep"; render(); break;
    case "copy": (navigator.clipboard?.writeText("Demo: the full card prompt is copied here.")||Promise.reject()).then(()=>toast("Prompt copied. Paste it into Claude or ChatGPT."),()=>toast("In the portal this copies the full card prompt.")); break;
    case "sc": toast(S.fail?"Scorecard saved. Day 6 opens after the retake is passed.":"Scorecard submitted. Day 6 is open."); break;
    case "live": toast(S.live==="later"?"Scheduled. Day 44 is open.":"Saved. Day 44 is open."); break;
    case "soon": toast("Opens in the full portal."); break;
    case "ack": toast("Acknowledged. Added to the engineer’s timeline."); break;
    case "uc": S.unlock=null; keep(); break;
    case "us": toast(`Unlocked for ${S.unlock}. Reason saved.`); S.unlock=null; keep(); break;
    case "ov": {const n=$("#ovn").value.trim(), r=document.querySelector('input[name="ov"]:checked'); if(!n){toast("Add a note so Meera knows why."); $("#ovn").focus(); break;} S.ov.push({by:"Priya Rao",from:S.ov.at(-1)?.to??3,to:+r.value,note:n,when:"Today"}); keep(); toast("Score saved. Meera sees both scores."); break;}
    case "gs": toast("Gate result saved."); break;
    case "pub": toast("Pools published for Days 1–5."); break;
    case "saved": toast("Saved."); break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="role"){S.role=t.value; render(); return;}
  if(t.dataset.act==="fail"){S.fail=t.checked; render(true); return;}
  if(t.name==="src"){S.wsrc=t.value; render(true); return;}
  if(t.name==="lp"){S.live=t.value; render(true); return;}
  if(t.name==="gno"){S.gateNo=+t.value; S.gate={}; render(true); return;}
  if(/^g\d+$/.test(t.name)){S.gate[t.name]=t.value; render(true); return;}
  if(t.dataset.roleOf){
    const admins=[...document.querySelectorAll("[data-role-of]")].filter(s=>s.value==="Admin");
    if(!admins.length){t.value="Admin"; toast("At least one admin must stay active."); return;}
    toast(`Role changed for ${t.dataset.roleOf}. Logged.`);
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="ur") $("#us").disabled=!e.target.value.trim(); if(e.target.id==="qw") S.q.txt=e.target.value; });
$("#theme").addEventListener("click",()=>{const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme=dark?"light":"dark";});
render();
</script>

</body></html>
